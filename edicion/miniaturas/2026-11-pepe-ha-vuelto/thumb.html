<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 900; src: url(inter-latin-900-normal.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #020a04; font-family: "Inter", sans-serif; }
  #c { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: radial-gradient(700px 500px at 30% 60%, rgba(40,255,120,0.35), transparent 70%), radial-gradient(600px 500px at 85% 30%, rgba(160,255,60,0.22), transparent 70%), linear-gradient(180deg, #03140a, #010603); }
  #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(60,255,140,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(60,255,140,0.10) 1px, transparent 1px); background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 80%, transparent); }
  #rays { position: absolute; left: -200px; top: -200px; width: 1100px; height: 1100px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(120,255,160,0.10) 0deg 6deg, transparent 6deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 65%); }
  svg#chart { position: absolute; left: 0; top: 0; }
  #person { position: absolute; right: -60px; bottom: -40px; height: 690px; filter: drop-shadow(0 0 18px rgba(80,255,140,0.9)) drop-shadow(0 20px 40px rgba(0,0,0,0.6)) contrast(1.08) saturate(1.12) brightness(1.05); }
  #coin { position: absolute; width: 330px; height: 330px; border-radius: 50%; overflow: hidden; border: 12px solid #7dff9a;
    box-shadow: 0 0 0 6px #0a3a18, 0 0 70px 20px rgba(80,255,140,0.75), 0 30px 60px rgba(0,0,0,0.7); }
  #coin img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
  .t { position: absolute; font-weight: 900; font-style: normal; letter-spacing: -0.02em; line-height: 0.9; transform: skewX(-8deg); white-space: nowrap; }
  .t.pepe { font-size: 210px; color: #b6ff3a; -webkit-text-stroke: 10px #052a0f; paint-order: stroke fill;
    text-shadow: 0 0 40px rgba(150,255,60,0.85), 0 10px 0 #052a0f, 0 16px 30px rgba(0,0,0,0.7); }
  .t.back { font-size: 128px; color: #fff; -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 8px 0 #000, 0 14px 30px rgba(0,0,0,0.7); }
  .badge { position: absolute; padding: 6px 22px; border-radius: 16px; background: #19d36b; color: #fff; font-weight: 900; font-size: 64px; transform: rotate(-6deg);
    box-shadow: 0 0 40px rgba(25,211,107,0.8), 0 10px 20px rgba(0,0,0,0.5); -webkit-text-stroke: 3px #063d1c; paint-order: stroke fill; }
  svg#arrow { position: absolute; }
</style></head>
<body><div id="c">
  <div id="rays"></div><div id="grid"></div>
  <svg id="chart" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  __LAYOUT__
</div>
<script>
  const S = __SERIES__;
  const svg = document.getElementById("chart"), NS = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  // weekly-ish candles from the real 3-month series, pushed into an explosive shape at the end
  const N = 46, step = S.length / N, mn = Math.min(...S), mx = Math.max(...S);
  const X0 = __CX0__, X1 = __CX1__, Y0 = 690, Y1 = __CY1__;
  const y = (v) => Y0 - Math.pow(Math.min(1.03, Math.max(0, (v - mn) / (mx - mn))), 1.35) * (Y0 - Y1);
  for (let i = 0; i < N; i++) {
    const a = S[Math.floor(i * step)], b = S[Math.min(S.length - 1, Math.floor((i + 1) * step))];
    const hi = Math.max(a, b) * 1.012, lo = Math.min(a, b) * 0.988;
    const x = X0 + (i / (N - 1)) * (X1 - X0), w = (X1 - X0) / N * 0.62, up = b >= a;
    const col = up ? "#2bff7a" : "#ff3b4e";
    el("line", { x1: x, x2: x, y1: y(hi), y2: y(lo), stroke: col, "stroke-width": 3, opacity: 0.9 });
    el("rect", { x: x - w / 2, y: Math.min(y(a), y(b)), width: w, height: Math.max(4, Math.abs(y(a) - y(b))), fill: col, opacity: 0.95,
      style: up ? "filter: drop-shadow(0 0 6px rgba(43,255,122,0.8))" : "" });
  }
</script></body></html>
