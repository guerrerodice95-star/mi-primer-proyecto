<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; --ink: #0b0a08; --line: rgba(201,165,76,0.38); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }
      .goldtext { background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

      #bg { background: radial-gradient(900px 700px at 22% 45%, rgba(201,165,76,0.16), transparent 70%), linear-gradient(90deg, #14110b, #0b0a08); }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.06) 1px, transparent 1px); background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); }

      #camwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 48.4% 0%; }
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.04); }
      #camfade { position: absolute; left: -2px; top: 0; width: 760px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, #0b0a08 0%, rgba(11,10,8,0.85) 30%, rgba(11,10,8,0) 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,0.5) 100%); }
      #bottomShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.65) 100%); }

      .kw { position: absolute; left: 0; right: 0; top: 840px; text-align: center; opacity: 0; text-shadow: 0 6px 26px rgba(0,0,0,0.8); }
      .kw .serif { font-size: 100px; color: #f6e6b8; margin: 0 20px; }
      .kw b { font-weight: 900; font-size: 100px; letter-spacing: -0.01em; }
      .kw .box { display: inline-block; color: #1a1408; padding: 0 30px; border-radius: 22px; text-shadow: none;
        background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 50px rgba(201,165,76,0.45); }

      /* card: tu jubilación */
      #card { position: absolute; left: 100px; top: 170px; width: 740px; height: 740px; border-radius: 40px; opacity: 0;
        background: rgba(22,19,13,0.92); border: 1.5px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 70px rgba(201,165,76,0.18); }
      #card .lbl { position: absolute; left: 56px; top: 54px; font-weight: 700; font-size: 28px; letter-spacing: 0.18em; color: var(--gold); }
      #base { position: absolute; left: 0; right: 0; bottom: 70px; height: 3px; margin: 0 56px; background: rgba(255,255,255,0.15); }
      #col { position: absolute; left: 90px; bottom: 73px; width: 220px; }
      #gold { width: 220px; height: 300px; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo));
        box-shadow: 0 0 50px rgba(201,165,76,0.5); transform-origin: 50% 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 26px; }
      #gold span { width: 86px; height: 86px; border-radius: 50%; background: #1a1408; color: var(--gold-hi); font-weight: 900; font-size: 54px; display: flex; align-items: center; justify-content: center; }
      #grey { width: 220px; height: 170px; background: #3b3628; border-radius: 0; }
      .tag { position: absolute; left: 350px; white-space: nowrap; opacity: 0; }
      .tag b { display: block; font-size: 44px; font-weight: 800; }
      .tag .serif { font-size: 44px; color: #cfc3a6; }
      #tagGrey { bottom: 120px; }
      #tagGold { bottom: 330px; }
      #tagGold b { color: var(--gold-hi); }
      #plus { position: absolute; left: 350px; bottom: 470px; font-size: 40px; font-weight: 800; color: #1a1408; background: var(--gold); padding: 8px 22px; border-radius: 999px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.08" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="12.08" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="12.08" data-track-index="0"></div>
      <div id="camwrap">
        <video id="cam" class="clip" data-start="0" data-duration="12.08" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        <div id="camfade"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="12.08" data-track-index="2"></div>
      <div id="bottomShade" class="clip" data-start="0" data-duration="12.08" data-track-index="2"></div>

      <div id="pKw1" class="clip" data-start="3.1" data-duration="1.6" data-track-index="3">
        <div class="kw" id="kw1"><b>punto</b> <span class="serif">por</span> <b>punto</b></div>
      </div>

      <div id="pCard" class="clip" data-start="4.7" data-duration="5.2" data-track-index="3">
        <div id="card">
          <div class="lbl">TU JUBILACIÓN</div>
          <div id="col"><div id="gold"><span>₿</span></div><div id="grey"></div></div>
          <div id="base"></div>
          <div class="tag" id="tagGrey"><b>Pensión</b><span class="serif">lo que te da el Estado</span></div>
          <div class="tag" id="tagGold"><b>Patrimonio</b><span class="serif">construido con Bitcoin</span></div>
          <div id="plus">+ tranquilidad</div>
        </div>
      </div>

      <div id="pKw2" class="clip" data-start="10.9" data-duration="1.18" data-track-index="3">
        <div class="kw" id="kw2"><span class="serif">vivir mucho más</span> <b class="box">TRANQUILO</b></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";
      gsap.set("#gold", { scaleY: 0 });

      // camera (jump cuts, origin at the top)
      tl.fromTo(cam, { scale: 1.06 }, { scale: 1.1, duration: 1.46, ease: "none" }, 0);
      tl.set(cam, { scale: 1.2 }, 1.46);
      tl.to(cam, { scale: 1.23, duration: 1.8, ease: "none" }, 1.46);
      tl.set(cam, { scale: 1.1 }, 3.26);
      tl.to(cam, { scale: 1.13, duration: 1.4, ease: "none" }, 3.26);
      tl.to(cam, { x: 470, scale: 1.0, duration: 0.6, ease: "power3.inOut" }, 4.65);
      tl.to("#camfade", { opacity: 1, duration: 0.4 }, 4.75);
      tl.to(cam, { scale: 1.04, duration: 4.3, ease: "none" }, 5.25);
      tl.to(cam, { x: 0, scale: 1.08, duration: 0.6, ease: "power3.inOut" }, 9.7);
      tl.to("#camfade", { opacity: 0, duration: 0.3 }, 9.75);
      tl.to(cam, { scale: 1.12, duration: 0.8, ease: "none" }, 10.3);
      tl.set(cam, { scale: 1.22 }, 11.08);
      tl.to(cam, { scale: 1.25, duration: 1.0, ease: "none" }, 11.08);

      // punto por punto
      tl.to("#bottomShade", { opacity: 1, duration: 0.25 }, 3.15);
      tl.fromTo("#kw1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 3.26);
      tl.to("#kw1", { opacity: 0, duration: 0.2 }, 4.5);
      tl.to("#bottomShade", { opacity: 0, duration: 0.25 }, 4.5);

      // card
      tl.fromTo("#card", { opacity: 0, x: -60, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 4.85);
      tl.fromTo("#grey", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 5.1);
      tl.fromTo("#tagGrey", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 }, 5.3);
      tl.to("#gold", { scaleY: 1, duration: 1.0, ease: "power3.out" }, 7.36);
      tl.fromTo("#gold span", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, 7.9);
      tl.fromTo("#tagGold", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 }, 7.6);
      tl.fromTo("#plus", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 9.26);
      tl.to("#card", { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, 9.65);

      // tranquilo
      tl.to("#bottomShade", { opacity: 1, duration: 0.3 }, 10.95);
      tl.fromTo("#kw2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 11.08);
      tl.fromTo("#kw2 .box", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, 11.66);

      tl.set({}, {}, 12.08);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
