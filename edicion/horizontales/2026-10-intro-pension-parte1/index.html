<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; --ink: #0b0a08; --line: rgba(201,165,76,0.38); --red: #e5484d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }
      .goldtext { background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

      #bg { background: radial-gradient(900px 700px at 22% 45%, rgba(201,165,76,0.16), transparent 70%), linear-gradient(90deg, #14110b, #0b0a08); }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.06) 1px, transparent 1px); background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); }

      /* camera: origin at the top so zooms never crop more hair */
      #camwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 48.4% 0%; }
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.04); }
      #camfade { position: absolute; left: -2px; top: 0; width: 760px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, #0b0a08 0%, rgba(11,10,8,0.85) 30%, rgba(11,10,8,0) 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,0.5) 100%); }
      #leftShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(90deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.35) 30%, transparent 50%); }
      #bottomShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.65) 100%); }

      /* card: pensión media */
      #card { position: absolute; left: 100px; top: 250px; width: 740px; height: 560px; border-radius: 40px; opacity: 0;
        background: rgba(22,19,13,0.92); border: 1.5px solid var(--line);
        box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 70px rgba(201,165,76,0.18); }
      #card .lbl { position: absolute; left: 56px; top: 54px; font-weight: 700; font-size: 28px; letter-spacing: 0.18em; color: var(--gold); }
      #pill { position: absolute; left: 56px; top: 130px; padding: 10px 24px; border-radius: 999px; background: rgba(229,72,77,0.15); border: 1.5px solid var(--red); color: #ff8d90; font-weight: 800; font-size: 30px; letter-spacing: 0.06em; opacity: 0; }
      #num { position: absolute; left: 50px; top: 205px; white-space: nowrap; opacity: 0; font-weight: 900; font-size: 168px; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
      #mes { position: absolute; left: 60px; top: 400px; font-size: 76px; color: #f3e3b5; opacity: 0; }
      #bar { position: absolute; left: 56px; right: 56px; bottom: 56px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.08); overflow: hidden; }
      #barFill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); transform-origin: 0 50%; }

      /* years */
      #years { position: absolute; left: 120px; top: 300px; opacity: 0; }
      #yearsNum { display: block; font-weight: 900; font-size: 300px; letter-spacing: -0.05em; line-height: 0.9; font-variant-numeric: tabular-nums; }
      #yearsTxt { display: block; font-size: 92px; color: #f3e3b5; margin-top: 6px; }

      /* final keyword */
      #final { position: absolute; left: 0; right: 0; top: 820px; text-align: center; opacity: 0; }
      #final b { display: inline-block; font-weight: 900; font-size: 110px; letter-spacing: -0.01em; color: #1a1408; padding: 0 34px; border-radius: 22px;
        background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 50px rgba(201,165,76,0.45); }
      #final .serif { font-size: 104px; color: #f6e6b8; margin-left: 22px; text-shadow: 0 6px 26px rgba(0,0,0,0.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.44" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="13.44" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="13.44" data-track-index="0"></div>
      <div id="camwrap">
        <video id="cam" class="clip" data-start="0" data-duration="13.44" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        <div id="camfade"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="13.44" data-track-index="2"></div>
      <div id="leftShade" class="clip" data-start="0" data-duration="13.44" data-track-index="2"></div>
      <div id="bottomShade" class="clip" data-start="0" data-duration="13.44" data-track-index="2"></div>

      <div id="pCard" class="clip" data-start="1.3" data-duration="4.2" data-track-index="3">
        <div id="card">
          <div class="lbl">PENSIÓN MEDIA · ESPAÑA</div>
          <div id="pill">NO SUPERA</div>
          <div id="num" class="goldtext">0 €</div>
          <div id="mes" class="serif">al mes</div>
          <div id="bar"><div id="barFill"></div></div>
        </div>
      </div>

      <div id="pYears" class="clip" data-start="6.2" data-duration="3.4" data-track-index="3">
        <div id="years"><b id="yearsNum" class="goldtext">35</b><span id="yearsTxt" class="serif">años trabajando</span></div>
      </div>

      <div id="pFinal" class="clip" data-start="11.9" data-duration="1.54" data-track-index="3">
        <div id="final"><b>NO LLEGAS</b><span class="serif">a fin de mes</span></div>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";
      gsap.set("#barFill", { scaleX: 0 });

      // camera
      tl.fromTo(cam, { scale: 1.2, x: 0 }, { scale: 1.06, duration: 0.7, ease: "power3.out" }, 0);
      tl.to(cam, { x: 470, scale: 1.0, duration: 0.6, ease: "power3.inOut" }, 1.3);
      tl.to("#camfade", { opacity: 1, duration: 0.4 }, 1.4);
      tl.to(cam, { scale: 1.04, duration: 3.4, ease: "none" }, 1.9);
      tl.to(cam, { x: 0, scale: 1.06, duration: 0.6, ease: "power3.inOut" }, 5.2);
      tl.to("#camfade", { opacity: 0, duration: 0.3 }, 5.25);
      tl.to(cam, { x: 110, scale: 1.13, duration: 0.6, ease: "power2.inOut" }, 6.05);
      tl.to(cam, { scale: 1.16, duration: 2.8, ease: "none" }, 6.65);
      tl.set(cam, { x: 0, scale: 1.34 }, 9.46);
      tl.to(cam, { scale: 1.38, duration: 0.98, ease: "none" }, 9.46);
      tl.set(cam, { scale: 1.12 }, 10.44);
      tl.to(cam, { scale: 1.15, duration: 1.0, ease: "none" }, 10.44);
      tl.set(cam, { scale: 1.24 }, 11.46);
      tl.to(cam, { scale: 1.28, duration: 1.98, ease: "none" }, 11.46);

      // card: pensión media
      tl.fromTo("#card", { opacity: 0, x: -60, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 1.45);
      tl.fromTo("#pill", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 1.6);
      tl.to("#num", { opacity: 1, duration: 0.2 }, 1.7);
      const n = { v: 0 };
      tl.fromTo(n, { v: 0 }, { v: 1500, duration: 2.1, ease: "power2.inOut",
        onUpdate: () => { $("#num").textContent = (Math.round(n.v / 10) * 10).toLocaleString("es-ES").replace(/,/g, ".").replace(/^(\d)(\d{3})$/, "$1.$2") + " €"; } }, 1.7);
      tl.to("#barFill", { scaleX: 0.5, duration: 2.1, ease: "power2.inOut" }, 1.7);
      tl.fromTo("#num", { scale: 1 }, { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, 3.8);
      tl.fromTo("#mes", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 4.4);
      tl.to("#card", { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, 5.15);

      // years
      tl.to("#leftShade", { opacity: 1, duration: 0.4 }, 6.1);
      tl.fromTo("#years", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, 6.36);
      const y = { v: 35 };
      tl.fromTo(y, { v: 35 }, { v: 40, duration: 0.3, ease: "none", onUpdate: () => { $("#yearsNum").textContent = Math.round(y.v); } }, 7.22);
      tl.fromTo("#yearsNum", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "0% 100%" }, 7.5);
      tl.set(["#years", "#leftShade"], { opacity: 0 }, 9.46);

      // final keyword
      tl.to("#bottomShade", { opacity: 1, duration: 0.3 }, 11.95);
      tl.fromTo("#final", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 12.04);
      tl.fromTo("#final b", { scale: 0.7 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 12.04);

      tl.set({}, {}, 13.44);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
