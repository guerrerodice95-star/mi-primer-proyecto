<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
      :root { --gold: #c9a54c; --gold-hi: #f0d488; --red: #e5484d; --red-hi: #ff7a7e; --green: #16c784; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0a08; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }
      #bg { background: radial-gradient(900px 700px at 25% 45%, rgba(229,72,77,0.12), transparent 70%), radial-gradient(900px 700px at 75% 50%, rgba(201,165,76,0.10), transparent 70%), #0b0a08; }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.06) 1px, transparent 1px); background-size: 60px 60px; }
      #camwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 48% 0%; }
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.06); }
      #fadeL { position: absolute; left: -2px; top: 0; width: 820px; height: 1080px; opacity: 0; background: linear-gradient(90deg, #0b0a08 0%, rgba(11,10,8,0.9) 45%, rgba(11,10,8,0) 100%); }
      #fadeR { position: absolute; right: -2px; top: 0; width: 820px; height: 1080px; opacity: 0; background: linear-gradient(270deg, #0b0a08 0%, rgba(11,10,8,0.9) 45%, rgba(11,10,8,0) 100%); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,0.5) 100%); }
      #redTint { position: absolute; inset: 0; opacity: 0; background: radial-gradient(110% 100% at 50% 45%, transparent 45%, rgba(150,10,15,0.55) 100%); }
      #bottomShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.7) 100%); }
      .ov { position: absolute; opacity: 0; }
      .glass { position: absolute; border-radius: 30px; background: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.07));
        -webkit-backdrop-filter: blur(22px) saturate(1.4) brightness(0.72); backdrop-filter: blur(22px) saturate(1.4) brightness(0.72);
        border: 1.5px solid rgba(255,255,255,0.32); box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.35); }
      .chip { display: flex; align-items: center; gap: 18px; padding: 16px 30px 16px 16px; white-space: nowrap; }
      .chip img { width: 80px; height: 80px; border-radius: 50%; }
      .chip b { display: block; font-size: 40px; font-weight: 900; line-height: 1.05; }
      .chip i { display: block; font-style: normal; font-size: 34px; font-weight: 900; color: var(--red-hi); }
      .chip small { font-size: 20px; opacity: .75; margin-left: 6px; }
      .card { position: absolute; top: 120px; width: 800px; height: 840px; border-radius: 40px; opacity: 0;
        background: rgba(17,19,22,0.96); border: 1.5px solid rgba(255,255,255,0.10); box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
      .kw { position: absolute; left: 0; right: 0; top: 830px; text-align: center; opacity: 0; white-space: nowrap; text-shadow: 0 8px 30px rgba(0,0,0,0.85); }
      .kw b { font-size: 96px; font-weight: 900; }
      .kw .box { display: inline-block; padding: 4px 34px; border-radius: 24px; color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); text-shadow: none; box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 60px rgba(201,165,76,0.5); }
      .kw .serif { font-size: 80px; color: #f6e6b8; margin-right: 18px; }
          .kw .box.red { color: #fff; background: linear-gradient(180deg, #ff6b70, #d63a40); box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 60px rgba(229,72,77,0.45); }
      .chip .up { display: block; font-style: normal; font-size: 40px; font-weight: 900; color: #4ade80; }
      .chip .dn { display: block; font-style: normal; font-size: 40px; font-weight: 900; color: #ff7a7e; }
      .chip em { display: block; font-style: normal; font-size: 20px; font-weight: 700; opacity: .75; letter-spacing: .04em; }
          .pill { position: absolute; padding: 10px 24px; border-radius: 999px; font-size: 36px; font-weight: 900; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
      .pill.gold { background: linear-gradient(180deg, #f0d488, #c9a54c); color: #1a1408; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.04" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="19.04" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="19.04" data-track-index="0"></div>
      <div id="camwrap">
        <div id="track" style="position:absolute;inset:0"><video id="cam" class="clip" data-start="0" data-duration="19.04" data-track-index="1" src="assets/cam.mp4" muted playsinline></video></div>
        <div id="fadeL"></div><div id="fadeR"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="19.04" data-track-index="2"></div>
      <div id="redTint" class="clip" data-start="0" data-duration="19.04" data-track-index="2"></div>
      <div id="bottomShade" class="clip" data-start="0" data-duration="19.04" data-track-index="2"></div>
      <div id="fx" class="clip" data-start="0" data-duration="19.04" data-track-index="3"></div>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap", DUR = 19.04, NS = "http://www.w3.org/2000/svg";

__SCENES__
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
