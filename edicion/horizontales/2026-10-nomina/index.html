<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; --ink: #0b0a08; --line: rgba(201,165,76,0.38); --red: #e5484d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }
      .goldtext { background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

      #bg { background: radial-gradient(900px 700px at 22% 45%, rgba(201,165,76,0.16), transparent 70%), linear-gradient(90deg, #14110b, #0b0a08); }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.06) 1px, transparent 1px); background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); mask-image: linear-gradient(90deg, #000 0%, #000 35%, transparent 60%); }
      #camwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 48.4% 0%; }
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.04); }
      #camfade { position: absolute; left: -2px; top: 0; width: 760px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, #0b0a08 0%, rgba(11,10,8,0.85) 30%, rgba(11,10,8,0) 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,0.5) 100%); }
      #leftShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 28%, transparent 48%); }
      #bottomShade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.65) 100%); }

      .kw { position: absolute; left: 0; right: 0; top: 850px; text-align: center; opacity: 0; text-shadow: 0 6px 26px rgba(0,0,0,0.8); white-space: nowrap; }
      .kw .serif { font-size: 92px; color: #f6e6b8; margin: 0 20px; }
      .kw .box { display: inline-block; font-weight: 900; font-size: 96px; color: #1a1408; padding: 0 30px; border-radius: 22px; text-shadow: none;
        background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 50px rgba(201,165,76,0.45); }

      .card { position: absolute; left: 100px; width: 740px; border-radius: 40px; opacity: 0;
        background: rgba(22,19,13,0.93); border: 1.5px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 70px rgba(201,165,76,0.18); }
      .card .lbl { position: absolute; left: 56px; top: 50px; font-weight: 700; font-size: 28px; letter-spacing: 0.18em; color: var(--gold); }
      .card .lbl .serif { letter-spacing: 0; font-size: 34px; color: #cfc3a6; margin-left: 12px; }

      /* nómina */
      #nom { top: 140px; height: 800px; }
      #bar { position: absolute; left: 56px; right: 56px; top: 120px; height: 46px; border-radius: 12px; background: rgba(255,255,255,0.06); overflow: hidden; }
      .seg { position: absolute; top: 0; bottom: 0; transform-origin: 0 50%; border-right: 2px solid #16130d; }
      #rows { position: absolute; left: 56px; right: 56px; top: 200px; }
      .r { display: flex; align-items: center; gap: 22px; height: 82px; opacity: 0; }
      .r i { flex: none; width: 30px; height: 30px; border-radius: 8px; }
      .r b { font-size: 40px; font-weight: 800; }
      .r .serif { font-size: 36px; color: #b9ad92; margin-left: auto; }
      .r.inv { height: 150px; margin-top: 8px; padding: 0 24px; border-radius: 22px; border: 1.5px solid var(--gold); background: rgba(201,165,76,0.1);
        box-shadow: 0 0 40px rgba(201,165,76,0.3); flex-wrap: wrap; align-content: center; row-gap: 4px; }
      .r.inv b { font-size: 46px; color: var(--gold-hi); }
      #oblig { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; padding: 8px 16px; border-radius: 999px; background: var(--red); color: #fff; opacity: 0; }
      #perder { flex-basis: 100%; padding-left: 52px; font-size: 34px; color: #f3e3b5; opacity: 0; }

      /* activos */
      #assets { position: absolute; left: 110px; top: 210px; }
      .as { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; padding: 22px 36px 22px 22px; border-radius: 999px; width: fit-content;
        background: rgba(22,19,13,0.92); border: 1.5px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,0.5); opacity: 0; }
      .as span { width: 70px; height: 70px; border-radius: 50%; background: var(--gold); color: #1a1408; font-weight: 900; font-size: 34px; display: flex; align-items: center; justify-content: center; }
      .as b { font-size: 50px; font-weight: 800; }

      /* patrimonio */
      #pat { top: 160px; height: 760px; }
      #pat h3 { position: absolute; left: 56px; top: 100px; font-size: 70px; font-weight: 900; letter-spacing: -0.02em; }
      #pat h3 .serif { font-size: 76px; color: #f3e3b5; font-weight: 400; }
      #months { position: absolute; left: 56px; right: 56px; bottom: 70px; height: 400px; display: flex; align-items: flex-end; gap: 14px; }
      .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
      .m div { width: 100%; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo)); transform-origin: 50% 100%; }
      .m span { margin-top: 12px; font-size: 22px; font-weight: 700; color: #9c8f73; }
      #futuro { position: absolute; right: 40px; top: 200px; font-size: 30px; font-weight: 800; letter-spacing: 0.1em; color: #1a1408; background: var(--gold-hi); padding: 10px 20px; border-radius: 999px; opacity: 0;
        box-shadow: 0 0 40px rgba(201,165,76,0.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.84" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="36.84" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="36.84" data-track-index="0"></div>
      <div id="camwrap">
        <video id="cam" class="clip" data-start="0" data-duration="36.84" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        <div id="camfade"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="36.84" data-track-index="2"></div>
      <div id="leftShade" class="clip" data-start="0" data-duration="36.84" data-track-index="2"></div>
      <div id="bottomShade" class="clip" data-start="0" data-duration="36.84" data-track-index="2"></div>

      <div id="pKw1" class="clip" data-start="1.8" data-duration="2.0" data-track-index="3">
        <div class="kw" id="kw1"><span class="serif">cuando cobramos</span><span class="box">EL SUELDO</span></div>
      </div>

      <div id="pNom" class="clip" data-start="5.2" data-duration="18.4" data-track-index="3">
        <div class="card" id="nom">
          <div class="lbl">TU NÓMINA <span class="serif">cada mes</span></div>
          <div id="bar">
            <div class="seg" style="left:0;width:32%;background:#6d6352"></div>
            <div class="seg" style="left:32%;width:10%;background:#857a63"></div>
            <div class="seg" style="left:42%;width:13%;background:#5a5244"></div>
            <div class="seg" style="left:55%;width:20%;background:#9a8d72"></div>
            <div class="seg" style="left:75%;width:8%;background:#b3a585"></div>
            <div class="seg" style="left:83%;width:17%;background:linear-gradient(90deg,var(--gold-hi),var(--gold));border:0"></div>
          </div>
          <div id="rows">
            <div class="r"><i style="background:#6d6352"></i><b>Hipoteca</b></div>
            <div class="r"><i style="background:#857a63"></i><b>Seguros</b></div>
            <div class="r"><i style="background:#5a5244"></i><b>Otros gastos</b></div>
            <div class="r"><i style="background:#9a8d72"></i><b>Comida</b></div>
            <div class="r"><i style="background:#b3a585"></i><b>Ocio</b><span class="serif">si se puede</span></div>
            <div class="r inv"><i style="background:var(--gold-hi)"></i><b>Inversión</b><span id="oblig" style="margin-left:auto">OBLIGATORIO</span><span id="perder" class="serif">lo que puedas asumir perder</span></div>
          </div>
        </div>
      </div>

      <div id="pAssets" class="clip" data-start="23.6" data-duration="4.6" data-track-index="3">
        <div id="assets">
          <div class="as"><span>₿</span><b>Bitcoin</b></div>
          <div class="as"><span style="font-size:24px">500</span><b>S&amp;P 500</b></div>
          <div class="as"><span>↗</span><b>Acciones</b></div>
          <div class="as"><span style="font-size:26px">ETF</span><b>ETFs</b></div>
        </div>
      </div>

      <div id="pPat" class="clip" data-start="28.2" data-duration="5.65" data-track-index="3">
        <div class="card" id="pat">
          <div class="lbl">TU PATRIMONIO</div>
          <h3><span class="serif">mes a mes</span></h3>
          <div id="futuro">TU FUTURO</div>
          <div id="months"></div>
        </div>
      </div>

      <div id="pKw2" class="clip" data-start="34.1" data-duration="1.25" data-track-index="3">
        <div class="kw" id="kw2"><span class="box">OBLIGATORIO</span></div>
      </div>
      <div id="pKw3" class="clip" data-start="35.2" data-duration="1.64" data-track-index="3">
        <div class="kw" id="kw3"><span class="serif">lo tendrían que enseñar en los</span><span class="box">COLEGIOS</span></div>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";

      // months chart
      const M = ["E", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
      const months = $("#months");
      M.forEach((m, i) => {
        const c = document.createElement("div"); c.className = "m";
        const h = 40 + Math.pow(i / 11, 1.5) * 340;
        c.innerHTML = `<div style="height:${h}px"></div><span>${m}</span>`; months.appendChild(c);
      });
      gsap.set(".seg", { scaleX: 0 });
      gsap.set(".m div", { scaleY: 0 });

      // ---------- camera (origin at top; jump cuts) ----------
      const split = (t, s = 1.0) => { tl.to(cam, { x: 470, scale: s, duration: 0.55, ease: "power3.inOut" }, t); tl.to("#camfade", { opacity: 1, duration: 0.4 }, t + 0.1); };
      const full = (t, s = 1.08) => { tl.to(cam, { x: 0, scale: s, duration: 0.55, ease: "power3.inOut" }, t); tl.to("#camfade", { opacity: 0, duration: 0.3 }, t + 0.05); };
      tl.fromTo(cam, { scale: 1.04 }, { scale: 1.07, duration: 1.94, ease: "none" }, 0);
      tl.set(cam, { scale: 1.18 }, 1.94);
      tl.set(cam, { scale: 1.06 }, 3.64);
      tl.to(cam, { scale: 1.09, duration: 1.4, ease: "none" }, 3.64);
      split(5.2);
      [[7.68, 1.07], [10.04, 1.0], [12.16, 1.07], [14.48, 1.0], [17.04, 1.12], [20.68, 1.04]].forEach(([t, s]) => tl.set(cam, { scale: s }, t));
      full(23.45, 1.1);
      tl.to(cam, { x: 260, scale: 1.3, duration: 0.5, ease: "power3.inOut" }, 23.95);
      tl.to("#leftShade", { opacity: 1, duration: 0.4 }, 23.95);
      tl.to("#leftShade", { opacity: 0, duration: 0.3 }, 28.0);
      split(28.1);
      tl.set(cam, { scale: 1.06 }, 31.28);
      full(33.75, 1.1);
      tl.set(cam, { scale: 1.22 }, 34.74);
      tl.to(cam, { scale: 1.26, duration: 2.1, ease: "none" }, 34.74);

      // ---------- sueldo ----------
      tl.to("#bottomShade", { opacity: 1, duration: 0.25 }, 1.85);
      tl.fromTo("#kw1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 1.94);
      tl.fromTo("#kw1 .box", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 3.0);
      tl.to("#kw1", { opacity: 0, duration: 0.2 }, 3.6);
      tl.to("#bottomShade", { opacity: 0, duration: 0.25 }, 3.6);

      // ---------- nómina ----------
      tl.fromTo("#nom", { opacity: 0, x: -60, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 5.5);
      const rowT = [7.68, 8.82, 10.04, 12.16, 14.48, 17.04];
      const rows = $$(".r"), segs = $$(".seg");
      rowT.forEach((t, i) => {
        tl.fromTo(rows[i], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.to(segs[i], { scaleX: 1, duration: 0.45, ease: "power3.out" }, t);
      });
      tl.fromTo("#oblig", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 17.3);
      tl.fromTo(".r.inv", { scale: 1 }, { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1 }, 17.3);
      tl.fromTo("#perder", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 20.68);
      tl.to("#nom", { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, 23.3);

      // ---------- activos ----------
      [24.32, 25.62, 26.7, 27.32].forEach((t, i) => tl.fromTo($$(".as")[i], { opacity: 0, x: -50, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, t));
      $$(".as").forEach((a, i) => tl.to(a, { opacity: 0, x: -60, duration: 0.25, ease: "power2.in" }, 27.85 + i * 0.04));

      // ---------- patrimonio ----------
      tl.fromTo("#pat", { opacity: 0, x: -60, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 28.45);
      $$(".m div").forEach((b, i) => tl.to(b, { scaleY: 1, duration: 0.45, ease: "power3.out" }, 29.54 + i * 0.3));
      tl.fromTo("#futuro", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 33.36);
      tl.to("#pat", { opacity: 0, x: -40, duration: 0.25, ease: "power2.in" }, 33.6);

      // ---------- final ----------
      tl.to("#bottomShade", { opacity: 1, duration: 0.25 }, 34.1);
      tl.fromTo("#kw2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 34.24);
      tl.to("#kw2", { opacity: 0, duration: 0.15 }, 35.2);
      tl.fromTo("#kw3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 35.3);
      tl.fromTo("#kw3 .box", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 35.96);

      tl.set({}, {}, 36.84);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
