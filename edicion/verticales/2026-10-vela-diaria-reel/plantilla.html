<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; --cream: #f3e3b5; --green: #3fbf7f; --red: #e5484d; --line: rgba(201,165,76,0.38); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a08; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }

      #bg { background: radial-gradient(900px 700px at 50% 25%, rgba(201,165,76,0.16), transparent 70%), linear-gradient(180deg, #14110b 0%, #0b0a08 55%); }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.07) 1px, transparent 1px); background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 42%, transparent 55%); mask-image: linear-gradient(180deg, #000 0%, #000 42%, transparent 55%); }

      /* 16:9 source laid out at 1920x1080, cropped into 9:16; origin on the face */
      #camwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 870px 0px; }
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.06); }
      #camfade { position: absolute; left: 0; top: -2px; width: 1920px; height: 180px; background: linear-gradient(180deg, #0b0a08 0%, rgba(11,10,8,0.7) 35%, rgba(11,10,8,0) 100%); }
      #topfade { position: absolute; left: 0; top: 0; width: 1080px; height: 240px; pointer-events: none; background: linear-gradient(180deg, rgba(11,10,8,1) 0%, rgba(11,10,8,0.55) 45%, rgba(11,10,8,0) 100%); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 85% at 50% 45%, transparent 60%, rgba(0,0,0,0.45) 100%); }

      /* chart */
      #chartCard { position: absolute; left: 40px; top: 190px; width: 1000px; height: 700px; border-radius: 34px; opacity: 0;
        background: rgba(18,15,10,0.94); border: 1.5px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(201,165,76,0.16); overflow: hidden; }
      #chart { position: absolute; inset: 0; }
      #chart text { font-family: "Inter", sans-serif; }
      .lbl { font-size: 26px; font-weight: 800; letter-spacing: 0.12em; fill: var(--cream); }
      .pill { position: absolute; padding: 10px 22px; border-radius: 999px; font-weight: 900; font-size: 34px; letter-spacing: 0.06em; opacity: 0; white-space: nowrap; }
      #pill15 { left: 250px; top: 24px; font-size: 28px; color: #1a1408; background: var(--gold-hi); box-shadow: 0 0 30px rgba(201,165,76,0.6); }
      #pillShort { right: 40px; color: #fff; background: var(--red); box-shadow: 0 0 30px rgba(229,72,77,0.6); top: 120px; }
      #pillLong { right: 40px; color: #fff; background: var(--green); box-shadow: 0 0 30px rgba(63,191,127,0.6); top: 526px; }
      #stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); padding: 18px 40px; border: 6px solid var(--red); border-radius: 20px;
        color: var(--red); font-weight: 900; font-size: 74px; letter-spacing: 0.04em; background: rgba(11,10,8,0.85); opacity: 0; white-space: nowrap; }
      #rentable { position: absolute; right: 50px; top: 40px; font-weight: 900; font-size: 46px; color: var(--green); opacity: 0; text-shadow: 0 0 24px rgba(63,191,127,0.7); }

      /* CTA: Instagram-style floating follow pill (no card behind) */
      #ig { position: absolute; left: 90px; right: 90px; top: 1600px; height: 150px; border-radius: 34px; background: #ffffff; opacity: 0;
        display: flex; align-items: center; padding: 0 26px; gap: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
      #ig img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; flex: none;
        box-shadow: 0 0 0 4px #fff, 0 0 0 7px #d62976; }
      #igName { flex: 1; font-weight: 800; font-size: 40px; color: #111; letter-spacing: -0.01em; white-space: nowrap; }
      #igName span { display: inline-block; }
      #igBtn { position: relative; flex: none; width: 220px; height: 88px; border-radius: 18px; background: #0095f6; color: #fff; font-weight: 800; font-size: 38px;
        display: flex; align-items: center; justify-content: center; }
      #igBtn .on { position: absolute; inset: 0; border-radius: 18px; background: #efefef; color: #111; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #igSave { position: relative; flex: none; width: 88px; height: 88px; border-radius: 18px; background: #efefef; display: flex; align-items: center; justify-content: center; margin-left: -8px; }
      #igSave svg { width: 46px; height: 46px; }
      #tap { position: absolute; width: 70px; height: 70px; left: 0; top: 0; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }
      #ripple { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.9); left: 0; top: 0; opacity: 0; }

      /* captions */
      #caps { position: absolute; inset: 0; pointer-events: none; }
      .cg { position: absolute; left: 50px; right: 50px; top: 1500px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 20px; opacity: 0; text-align: center; }
      .cg.hook { top: 1480px; gap: 0 28px; }
      .w { position: relative; display: inline-block; font-weight: 800; font-size: 72px; line-height: 1.14; letter-spacing: -0.01em; color: #fff; opacity: 0.38;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 26px rgba(0,0,0,0.75); }
      .hook .w { font-size: 90px; font-weight: 900; }
      .w.s { margin: 0 6px; font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 94px; color: #f6e6b8; letter-spacing: 0; }
      .w.g { color: var(--gold-hi); }
      .w.up { color: #6fe0a6; }
      .w.dn { color: #ff7a7e; }
      .w.b, .w.bup, .w.bdn { padding: 0 22px; border-radius: 16px; text-shadow: none; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      .w.b { color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(201,165,76,0.45); }
      .w.bup { color: #fff; background: var(--green); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(63,191,127,0.5); }
      .w.bdn { color: #fff; background: var(--red); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(229,72,77,0.5); }
      .w.u .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 11px; border-radius: 6px; background: var(--gold); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(201,165,76,0.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
      <div id="camwrap">
        <div id="track" style="position:absolute;inset:0">
        <video id="cam" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        </div>
        <div id="camfade"></div>
      </div>
      <div id="topfade" class="clip" data-start="0" data-duration="__DUR__" data-track-index="2"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="__DUR__" data-track-index="2"></div>

      <div id="pChart" class="clip" data-start="0.9" data-duration="66.2" data-track-index="3">
        <div id="chartCard">
          <svg id="chart" viewBox="0 0 1000 700" width="1000" height="700">
            <defs>
              <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d488"/><stop offset="1" stop-color="#8a6d2a"/></linearGradient>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <g id="zones"></g>
            <!-- levels -->
            <line id="lMax" x1="130" y1="110" x2="130" y2="110" stroke="#f3e3b5" stroke-width="4"/>
            <line id="lMin" x1="130" y1="590" x2="130" y2="590" stroke="#f3e3b5" stroke-width="4"/>
            <line id="lMid" x1="130" y1="350" x2="130" y2="350" stroke="#f0d488" stroke-width="4" stroke-dasharray="16 12"/>
            <text id="tMax" class="lbl" x="960" y="92" text-anchor="end" opacity="0">MÁXIMO</text>
            <text id="tMin" class="lbl" x="960" y="630" text-anchor="end" opacity="0">MÍNIMO</text>
            <text id="tMid" class="lbl" x="960" y="334" text-anchor="end" opacity="0" style="fill:#f0d488">50%</text>
            <ellipse id="cMid" cx="922" cy="325" rx="62" ry="34" fill="none" stroke="#f0d488" stroke-width="4" stroke-dasharray="420" stroke-dashoffset="420"/>
            <!-- daily candle -->
            <g id="daily">
              <line x1="75" y1="110" x2="75" y2="590" stroke="#f0d488" stroke-width="6"/>
              <rect x="40" y="160" width="70" height="380" rx="8" fill="url(#gGold)" filter="url(#glow)"/>
              <text x="75" y="356" text-anchor="middle" font-weight="900" font-size="30" fill="#1a1408" transform="rotate(-90 75 350)">1D</text>
            </g>
            <text id="tPrev" x="28" y="60" text-anchor="start" font-weight="800" font-size="22" letter-spacing="2" fill="#f0d488" opacity="0">VELA ANTERIOR</text>
            <g id="intro"></g>
            <g id="arrows">
              <path id="aUp" d="M520 350 C 590 350, 640 320, 690 230" fill="none" stroke="#3fbf7f" stroke-width="7" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300"/>
              <path id="aUpH" d="M668 236 L692 226 L696 252" fill="none" stroke="#3fbf7f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
              <path id="aDn" d="M520 350 C 590 350, 640 380, 690 470" fill="none" stroke="#e5484d" stroke-width="7" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300"/>
              <path id="aDnH" d="M668 464 L692 474 L696 448" fill="none" stroke="#e5484d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
            </g>
            <g id="scA"></g>
            <g id="scB"></g>
            <g id="scC"></g>
            <g id="xMark" opacity="0">
              <line id="x1" x1="150" y1="60" x2="960" y2="650" stroke="#e5484d" stroke-width="10" stroke-linecap="round" stroke-dasharray="1010" stroke-dashoffset="1010"/>
              <line id="x2" x1="960" y1="60" x2="150" y2="650" stroke="#e5484d" stroke-width="10" stroke-linecap="round" stroke-dasharray="1010" stroke-dashoffset="1010"/>
            </g>
          </svg>
          <div class="pill" id="pill15">⏱ 15 MIN</div>
          <div class="pill" id="pillShort">SHORT ↓</div>
          <div class="pill" id="pillLong">LONG ↑</div>
          <div id="rentable">+ RENTABLE</div>
          <div id="stamp">EVITAR OPERAR</div>
        </div>
      </div>

      <div id="pCta" class="clip" data-start="66.8" data-duration="4.6" data-track-index="3">
        <div id="ig">
          <img src="assets/perfil.png" alt="" />
          <div id="igName"></div>
          <div id="igBtn">Seguir<div class="on">Siguiendo</div></div>
          <div id="igSave"><svg viewBox="0 0 24 24"><path id="bmk" d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg></div>
        </div>
        <div id="ripple"></div>
        <svg id="tap" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6L9.4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="__DUR__" data-track-index="4"></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const NS = "http://www.w3.org/2000/svg";
      const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";
      const MAXY = 110, MINY = 590, MIDY = 350;

      // ---------- candles ----------
      // closes are y coordinates (smaller y = higher price). opts.hi / opts.lo override wick ends per index.
      function candles(parent, x0, closes, start, opts = {}) {
        const g = $(parent); const out = [];
        let prev = start;
        closes.forEach((c, i) => {
          const o = prev, up = c < o;
          const top = Math.min(o, c), bot = Math.max(o, c);
          const hi = (opts.hi && opts.hi[i] !== undefined) ? opts.hi[i] : top - 6 - rnd(i + x0) * 14;
          const lo = (opts.lo && opts.lo[i] !== undefined) ? opts.lo[i] : bot + 6 + rnd(i + x0 + 50) * 14;
          const x = x0 + i * 22, col = up ? "#3fbf7f" : "#e5484d";
          const cg = document.createElementNS(NS, "g");
          cg.innerHTML = `<line x1="${x + 8}" x2="${x + 8}" y1="${hi}" y2="${lo}" stroke="${col}" stroke-width="2.5"/>` +
            `<rect x="${x}" y="${top}" width="16" height="${Math.max(4, bot - top)}" rx="2" fill="${col}"/>`;
          cg.style.opacity = 0; g.appendChild(cg); out.push({ el: cg, x: x + 8 });
          prev = c;
        });
        return out;
      }
      const reveal = (list, t0, t1) => list.forEach((c, i) => tl.to(c.el, { opacity: 1, duration: 0.08 }, t0 + (t1 - t0) * (i / Math.max(1, list.length - 1))));
      function zone(id, y1, y2, col) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("id", id); r.setAttribute("x", 560); r.setAttribute("width", 400);
        r.setAttribute("y", Math.min(y1, y2)); r.setAttribute("height", Math.abs(y2 - y1)); r.setAttribute("fill", col); r.setAttribute("opacity", 0);
        $("#zones").appendChild(r); return r;
      }
      function ztext(parent, id, x, y, txt, col) {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("id", id); t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("text-anchor", "end");
        t.setAttribute("font-weight", "900"); t.setAttribute("font-size", "26"); t.setAttribute("fill", col); t.setAttribute("opacity", 0); t.textContent = txt;
        $(parent).appendChild(t); return t;
      }
      function ring(parent, cx, cy) {
        const e = document.createElementNS(NS, "ellipse");
        e.setAttribute("cx", cx); e.setAttribute("cy", cy); e.setAttribute("rx", 70); e.setAttribute("ry", 52); e.setAttribute("fill", "none");
        e.setAttribute("stroke", "#f0d488"); e.setAttribute("stroke-width", 5); e.setAttribute("stroke-dasharray", 400); e.setAttribute("stroke-dashoffset", 400);
        $(parent).appendChild(e); return e;
      }
      function hline(parent, y, col, dash) {
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", 170); l.setAttribute("x2", 960); l.setAttribute("y1", y); l.setAttribute("y2", y);
        l.setAttribute("stroke", col); l.setAttribute("stroke-width", 3); l.setAttribute("stroke-dasharray", dash || "8 8"); l.setAttribute("opacity", 0);
        $(parent).appendChild(l); return l;
      }
      const mirror = (a) => a.map((y) => 700 - y);

      // intro rally: "consistentemente rentable"
      const introC = candles("#intro", 180, [560, 540, 548, 515, 500, 470, 480, 440, 410, 420, 380, 340, 300, 310, 260, 220, 190], 575);

      // scenario A (short): above 50%, sweep of the high, back inside, targets 50% and the low
      const A1 = [330, 322, 305, 312, 288, 272, 262, 244, 232, 215];
      const A2 = [196, 176, 180]; const A3 = [172, 186, 178];
      const A5 = [196, 226, 262, 294, 330, 356, 344, 382, 424, 470, 512, 552, 586, 600];
      const scA1 = candles("#scA", 180, A1, 345);
      const scA2 = candles("#scA", 180 + 10 * 22, A2, 215, { hi: [undefined, 78, undefined] });
      const scA3 = candles("#scA", 180 + 13 * 22, A3, 180);
      const scA5 = candles("#scA", 180 + 16 * 22, A5, 178);
      const ringA = ring("#scA", 180 + 11 * 22 + 8, 112);
      const entryA = hline("#scA", 186, "#f0d488");
      const zA1 = zone("zA1", 186, MIDY, "rgba(229,72,77,0.22)"), zA2 = zone("zA2", MIDY, MINY, "rgba(229,72,77,0.14)");
      const tA1 = ztext("#scA", "tA1", 950, 275, "OBJETIVO 1", "#ff8d90"), tA2 = ztext("#scA", "tA2", 950, 520, "OBJETIVO 2", "#ff8d90");
      const tInA = ztext("#scA", "tInA", 700, 245, "DENTRO", "#f0d488");

      // scenario B (long): mirrored
      const scB1 = candles("#scB", 180, mirror(A1), 355);
      const scB2 = candles("#scB", 180 + 10 * 22, mirror(A2), 485, { lo: [undefined, 622, undefined] });
      const scB3 = candles("#scB", 180 + 13 * 22, mirror(A3), 520);
      const scB5 = candles("#scB", 180 + 16 * 22, mirror(A5), 522);
      const ringB = ring("#scB", 180 + 11 * 22 + 8, 588);
      const entryB = hline("#scB", 514, "#f0d488");
      const zB1 = zone("zB1", 514, MIDY, "rgba(63,191,127,0.22)"), zB2 = zone("zB2", MIDY, MAXY, "rgba(63,191,127,0.14)");
      const tB1 = ztext("#scB", "tB1", 950, 440, "OBJETIVO 1", "#7ff0b5"), tB2 = ztext("#scB", "tB2", 950, 200, "OBJETIVO 2", "#7ff0b5");
      const tInB = ztext("#scB", "tInB", 700, 470, "DENTRO", "#f0d488");

      // scenario C: chop around 50%
      const Cc = []; for (let i = 0; i < 26; i++) Cc.push(350 + Math.sin(i * 0.9) * 38 + (rnd(i + 7) - 0.5) * 30);
      const scC = candles("#scC", 180, Cc, 350);

      // ---------- captions ----------
      const G = __G__;
      const caps = $("#caps");
      const groups = G.map((g) => {
        const el = document.createElement("div"); el.className = "cg" + (g.hook ? " hook" : "");
        const ws = g.w.map(([t, s, st]) => {
          const sp = document.createElement("span"); sp.className = "w" + (st ? " " + st : ""); sp.textContent = t;
          if (st === "u") { const u = document.createElement("span"); u.className = "ul"; sp.appendChild(u); }
          el.appendChild(sp); return { el: sp, s, st };
        });
        caps.appendChild(el); return { el, s: g.w[0][1], e: g.e, ws };
      });
      gsap.set(".w.u .ul", { scaleX: 0 });
      gsap.set("#daily", { scaleY: 0, svgOrigin: "75 350" });

      // ---------- face tracking: keep the face horizontally centred ----------
      // FACE = smoothed face centre (1920-wide coords) every 0.2 s; camera origin is x=870
      const FACE = __FACE__;
      FACE.forEach((f, i) => {
        const v = Math.max(-250, Math.min(250, 870 - f.x));
        if (i === 0) tl.set("#track", { x: v }, 0);
        else tl.to("#track", { x: v, duration: f.t - FACE[i - 1].t, ease: "none" }, FACE[i - 1].t);
      });

      // ---------- camera ----------
      const FULL = { x: -330, y: 140, scale: 1.66 }, SPLIT = { x: -330, y: 1020, scale: 0.9 };
      const UP = -585;
      const toSplit = (t, s = SPLIT.scale) => {
        tl.to(cam, { x: SPLIT.x, y: SPLIT.y, scale: s, duration: 0.5, ease: "power3.inOut" }, t);
        tl.to("#caps", { y: UP, duration: 0.5, ease: "power3.inOut" }, t);
        tl.to("#chartCard", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.15);
      };
      const toFull = (t, s = FULL.scale, y = FULL.y) => {
        tl.to("#chartCard", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t - 0.05);
        tl.to(cam, { x: FULL.x, y: y, scale: s, duration: 0.5, ease: "power3.inOut" }, t);
        tl.to("#caps", { y: 0, duration: 0.5, ease: "power3.inOut" }, t);
      };
      tl.fromTo(cam, { x: FULL.x, y: FULL.y, scale: 1.82 }, { scale: 1.68, duration: 0.95, ease: "power2.out" }, 0);
      gsap.set("#chartCard", { y: -30 });
      toSplit(0.95);
      tl.to(cam, { scale: 0.94, duration: 11.6, ease: "none" }, 1.45);
      toFull(13.1, 1.66);
      tl.set(cam, { scale: 1.8 }, 15.38);
      toSplit(17.1);
      tl.to(cam, { scale: 0.94, duration: 24.0, ease: "none" }, 17.6);
      toFull(41.95, 1.5, 300);
      tl.to("#caps", { y: 170, duration: 0.3 }, 42.2);
      toSplit(43.6);
      tl.to(cam, { scale: 0.94, duration: 15.6, ease: "none" }, 44.1);
      toFull(59.85, 1.5, 300);
      toSplit(61.4);
      tl.to(cam, { scale: 0.94, duration: 5.4, ease: "none" }, 61.9);
