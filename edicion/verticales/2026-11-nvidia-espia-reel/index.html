    <style>

      * { margin: 0; padding: 0; box-sizing: border-box; }

        -webkit-mask-image: linear-gradient(180deg, transparent 45%, #000 55%, #000 85%, transparent 95%); mask-image: linear-gradient(180deg, transparent 45%, #000 55%, #000 85%, transparent 95%); }

      /* source band 1728x1144 */

      #strip { position: absolute; inset: 0; pointer-events: none; opacity: 1;

      #montaje { left: 40px; top: 1840px; font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.7); letter-spacing: 0.08em; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
      /* windows-like error dialog (generic, no brand) */
      #err { left: 70px; top: 250px; width: 700px; border-radius: 14px; overflow: hidden; background: #f3f3f3; color: #111;

      #err .tb { height: 58px; background: #ffffff; display: flex; align-items: center; padding: 0 20px; font-size: 26px; font-weight: 700; color: #222; border-bottom: 1px solid #ddd; }
      #err .tb span { margin-left: auto; width: 46px; height: 36px; display: flex; align-items: center; justify-content: center; background: #e81123; color: #fff; font-size: 24px; border-radius: 4px; }
      #err .bd { display: flex; gap: 24px; padding: 28px 28px 10px; align-items: center; }
      #err .ic { flex: none; width: 76px; height: 76px; border-radius: 50%; background: #e81123; color: #fff; font-size: 48px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

      #err .bt { display: flex; justify-content: flex-end; padding: 14px 28px 24px; }
      #err .bt div { padding: 10px 40px; border: 2px solid #0067c0; border-radius: 6px; font-size: 26px; font-weight: 700; background: #fff; }
      /* letterbox */
      .bar { position: absolute; left: 0; right: 0; height: 170px; background: #000; }
      /* lower cards (full screen moments) */
      .card { position: absolute; left: 70px; right: 70px; top: 1560px; height: 205px; border-radius: 32px; background: rgba(22,19,13,0.95);
        border: 1.5px solid rgba(201,165,76,0.45); box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
      /* NYT */
      #nyt { left: 116px; top: 960px; width: 847px; height: 762px; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.7); }
      #nyt img, #nyt svg { position: absolute; left: 0; top: 0; width: 847px; height: 762px; }
      /* Jensen photo */
      #jh { left: 70px; top: 975px; width: 430px; height: 560px; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.7); border: 2px solid rgba(201,165,76,0.6); }
      #jh img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
      #jhCap { left: 70px; top: 1548px; width: 430px; text-align: center; font-size: 22px; font-weight: 700; color: #8d826a; }
      .tagR { left: 540px; }
      /* 3D scene */
      #s3d { position: absolute; inset: 0; opacity: 0; overflow: hidden;
        background: radial-gradient(900px 700px at 50% 42%, rgba(118,185,0,0.20), transparent 70%), #07090a; }
      #floor { position: absolute; left: -540px; right: -540px; top: 880px; height: 1400px; transform-origin: 50% 0;
        background-image: linear-gradient(rgba(118,185,0,0.28) 2px, transparent 2px), linear-gradient(90deg, rgba(118,185,0,0.28) 2px, transparent 2px);
        background-size: 90px 90px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 75%); mask-image: linear-gradient(180deg, #000, transparent 75%); }
      #stage { position: absolute; left: 540px; top: 760px; width: 0; height: 0; perspective: 1400px; }
      #chip { position: absolute; left: -210px; top: -210px; width: 420px; height: 420px; transform-style: preserve-3d; }
      #chip .face { position: absolute; inset: 0; border-radius: 34px; }
      #chip .pcb { background: linear-gradient(135deg, #1b5e20, #0d3b12); border: 4px solid #2e7d32; transform: translateZ(0px); }
      #chip .die { position: absolute; left: 70px; top: 70px; width: 280px; height: 280px; border-radius: 22px; transform: translateZ(26px);

        box-shadow: 0 0 60px rgba(118,185,0,0.6); }
      #chip .die b { font-size: 64px; font-weight: 900; color: #76b900; letter-spacing: 0.04em; }
      #chip .die i { font-style: normal; font-size: 30px; font-weight: 800; color: #f0d488; letter-spacing: 0.3em; margin-top: 6px; }
      #chip .pin { position: absolute; background: linear-gradient(180deg, #f0d488, #8a6d2a); border-radius: 3px; transform: translateZ(2px); }
      #iaGlow { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 150px; font-weight: 900; color: #fff; opacity: 0;
        text-shadow: 0 0 40px rgba(118,185,0,0.9), 0 0 90px rgba(118,185,0,0.6); }
      .flag { position: absolute; top: 1080px; width: 380px; height: 200px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(22,19,13,0.92); border: 2px solid rgba(255,255,255,0.18); box-shadow: 0 24px 60px rgba(0,0,0,0.6); opacity: 0; }
      .flag span { font-size: 80px; line-height: 1; }
      .flag b { margin-top: 10px; font-size: 34px; font-weight: 900; letter-spacing: 0.06em; }
      #fUS { left: 40px; } #fCN { right: 40px; }
      #vs { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; font-size: 64px; font-weight: 900; color: #f0d488; opacity: 0; }

      .w.fvg, .w.bag { padding: 0 18px; border-radius: 14px; font-weight: 900; text-shadow: none; }
      .w.fvg { color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 0 34px rgba(201,165,76,0.45); }
      .w.bag { color: #fff; background: linear-gradient(180deg, #2fb57a, #1f8a5a); box-shadow: 0 0 34px rgba(63,191,127,0.45); }
      /* captions */
      #caps { position: absolute; inset: 0; pointer-events: none; }
      .cg { position: absolute; left: 70px; right: 70px; top: 1420px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 20px; opacity: 0; text-align: center; }
      .w { position: relative; display: inline-block; font-weight: 800; font-size: 72px; line-height: 1.14; letter-spacing: -0.01em; color: #fff; opacity: 0.38;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 26px rgba(0,0,0,0.75); }
      .hook .w { font-size: 80px; font-weight: 900; }
      .w.s { margin: 0 6px; font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 92px; color: #f6e6b8; letter-spacing: 0; }
      .w.g { color: var(--gold-hi); }
      .w.up { color: #6fe0a6; }
      .w.dn { color: #ff7a7e; }
      .w.b { padding: 0 20px; border-radius: 16px; text-shadow: none; font-weight: 900; color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(201,165,76,0.45); }
      .w.u .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 11px; border-radius: 6px; background: var(--gold); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(201,165,76,0.8); }

      /* Instagram follow pill */
      #ig { position: absolute; left: 90px; right: 90px; top: 1600px; height: 150px; border-radius: 34px; background: #ffffff; opacity: 0;
        display: flex; align-items: center; padding: 0 26px; gap: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
      #ig img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 4px #fff, 0 0 0 7px #d62976; }
      #igName { flex: 1; font-weight: 800; font-size: 40px; color: #111; letter-spacing: -0.01em; white-space: nowrap; }
      #igName span { display: inline-block; }
      #igBtn { position: relative; flex: none; width: 220px; height: 88px; border-radius: 18px; background: #0095f6; color: #fff; font-weight: 800; font-size: 38px; display: flex; align-items: center; justify-content: center; }
      #igBtn .on { position: absolute; inset: 0; border-radius: 18px; background: #efefef; color: #111; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #igSave { position: relative; flex: none; width: 88px; height: 88px; border-radius: 18px; background: #efefef; display: flex; align-items: center; justify-content: center; margin-left: -8px; }

      #tap { position: absolute; width: 70px; height: 70px; left: 0; top: 0; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }
      #ripple { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.9); left: 0; top: 0; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="58.76" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="58.76" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="58.76" data-track-index="0"></div>
      <div id="camwrap">
        <div id="track">
          <video id="cam" class="clip" data-start="0" data-duration="58.76" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        </div>
      </div>
      <div id="strip" class="clip" data-start="0" data-duration="58.76" data-track-index="2"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="58.76" data-track-index="2"></div>

      <div id="pChart" class="clip" data-start="0" data-duration="56.9" data-track-index="3">
        <div id="chartWrap"><svg id="chart" viewBox="0 0 1020 720" width="1020" height="720"></svg></div>
      </div>

      <div id="fx"></div>
      <video id="hook" class="clip" data-start="0" data-duration="7.05" data-track-index="4" src="assets/hook.mp4" muted playsinline></video>

          <img src="assets/perfil.png" alt="" />
          <div id="igName"></div>
          <div id="igBtn">Seguir<div class="on">Siguiendo</div></div>
          <div id="igSave"><svg viewBox="0 0 24 24"><path id="bmk" d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg></div>
        </div>
        <div id="ripple"></div>
        <svg id="tap" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6L9.4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="58.76" data-track-index="5"></div>
      <div id="flash" class="clip" data-start="0" data-duration="58.76" data-track-index="6"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const NS = "http://www.w3.org/2000/svg";
      const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";
