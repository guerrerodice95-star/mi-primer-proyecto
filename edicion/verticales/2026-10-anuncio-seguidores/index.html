<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root {
        --gold: #c9a54c;
        --gold-hi: #f0d488;
        --gold-lo: #8a6d2a;
        --ink: #0b0a08;
        --panel: rgba(22, 19, 13, 0.92);
        --line: rgba(201, 165, 76, 0.38);
        --red: #e5484d;
        --green: #3fbf7f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }
      .serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; }
      .goldtext {
        background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      /* ---------- background (seen in split mode) ---------- */
      #bg {
        background:
          radial-gradient(900px 600px at 50% 18%, rgba(201,165,76,0.20), transparent 70%),
          radial-gradient(700px 700px at 85% 60%, rgba(201,165,76,0.08), transparent 70%),
          linear-gradient(180deg, #14110b 0%, #0b0a08 60%);
      }
      #grid {
        background-image:
          linear-gradient(rgba(201,165,76,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(201,165,76,0.07) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 75%);
        mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 75%);
      }

      /* ---------- camera ---------- */
      #camwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 30%; will-change: transform; }
      #cam { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover;
        filter: contrast(1.1) saturate(1.06) brightness(0.95) sepia(0.07); }
      #camfade { position: absolute; left: 0; top: -2px; width: 1080px; height: 340px;
        background: linear-gradient(180deg, #0b0a08 0%, rgba(11,10,8,0.85) 30%, rgba(11,10,8,0) 100%); opacity: 0; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(130% 85% at 50% 38%, transparent 55%, rgba(0,0,0,0.55) 100%),
          linear-gradient(180deg, transparent 62%, rgba(0,0,0,0.45) 100%); }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #fff3c9, var(--gold)); opacity: 0; mix-blend-mode: screen; }

      /* ---------- shared panel look ---------- */
      .card {
        position: absolute; background: var(--panel); border: 1.5px solid var(--line); border-radius: 36px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(201,165,76,0.18);
      }
      .chip {
        position: absolute; padding: 18px 30px; border-radius: 999px; font-weight: 800; font-size: 40px; letter-spacing: 0.02em;
        background: rgba(22,19,13,0.95); border: 1.5px solid var(--line); color: #f5ead0; white-space: nowrap;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      }
      .label { font-weight: 700; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
      .cursor { position: absolute; width: 70px; height: 70px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }

      /* A1 chart */
      #chartCard { left: 110px; top: 220px; width: 860px; height: 560px; transform-origin: 50% 50%; }
      #chartCard .hdr { position: absolute; left: 40px; top: 34px; right: 40px; display: flex; align-items: center; gap: 20px; }
      .btc { width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: #1a1408; font-weight: 900; font-size: 40px; display: flex; align-items: center; justify-content: center; }
      #chartCard .pair { font-weight: 800; font-size: 40px; }
      #chartCard .price { margin-left: auto; text-align: right; }
      #chartCard .price b { display: block; font-size: 38px; font-weight: 800; }
      #chartCard .price span { font-size: 26px; color: var(--red); font-weight: 700; }
      #closeX { position: absolute; right: 26px; top: -26px; width: 64px; height: 64px; border-radius: 50%; background: #2a241a; border: 1.5px solid var(--line); color: #fff; font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      #chartCard .tabs { position: absolute; left: 40px; top: 122px; display: flex; gap: 14px; }
      #chartCard .tabs div { font-size: 22px; font-weight: 700; color: #9c8f73; padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,0.04); }
      #chartCard svg { position: absolute; left: 30px; top: 180px; }
      #timer { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 420px; display: flex; align-items: center; gap: 24px; padding: 26px 48px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--gold); box-shadow: 0 0 50px rgba(201,165,76,0.3); opacity: 0; }
      #timer b { font-size: 96px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      #timer .serif { font-size: 56px; color: var(--gold-hi); }

      /* A3 jargon */
      #jargonTitle { position: absolute; top: 230px; width: 100%; text-align: center; font-size: 64px; color: #f3e3b5; opacity: 0; }
      .chip .q { color: var(--gold); margin-left: 8px; }

      /* name lower third */
      #nameCard { left: 70px; top: 1215px; height: 150px; display: flex; align-items: center; gap: 26px; padding: 0 44px 0 24px; border-radius: 30px; opacity: 0; }
      #nameCard img { width: 108px; height: 108px; border-radius: 26px; object-fit: cover; border: 1.5px solid var(--line); }
      #nameCard .nm { font-size: 70px; font-weight: 900; letter-spacing: -0.01em; line-height: 1; }
      #nameCard .sub { font-size: 34px; font-weight: 600; color: #d9ccb0; margin-top: 8px; display: flex; align-items: center; gap: 12px; }
      #yearBox { display: inline-block; background: var(--gold); color: #1a1408; font-weight: 900; padding: 2px 14px; border-radius: 10px; }

      /* C community */
      #netWrap { position: absolute; left: 0; top: 160px; width: 1080px; height: 760px; }
      #netLogo { position: absolute; left: 440px; top: 230px; width: 200px; height: 200px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); box-shadow: 0 0 70px rgba(201,165,76,0.55); }
      #netLogo img { width: 100%; height: 100%; object-fit: cover; }
      .av { position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle at 50% 36%, #e9dcc0 0 16%, transparent 17%), radial-gradient(circle at 50% 100%, #e9dcc0 0 38%, transparent 39%), #2a2418; }
      #netLines line { stroke: rgba(201,165,76,0.45); stroke-width: 2; }
      #commTitle { position: absolute; top: 210px; width: 100%; text-align: center; font-size: 60px; font-weight: 800; opacity: 0; }
      #counter { position: absolute; top: 330px; width: 100%; text-align: center; opacity: 0; }
      #counter b { display: block; font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
      #counter .serif { font-size: 72px; color: #f3e3b5; }
      #pills { position: absolute; top: 665px; width: 100%; display: flex; justify-content: center; gap: 24px; }
      #pills .chip { position: relative; opacity: 0; }

      /* D profile */
      #profCard { left: 80px; top: 190px; width: 920px; height: 660px; }
      #profCard .top { position: absolute; left: 44px; top: 40px; right: 44px; display: flex; align-items: center; gap: 30px; }
      #profCard .top img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; }
      #profCard .handle { font-size: 46px; font-weight: 800; }
      #profCard .bio { font-size: 28px; color: #cfc3a6; margin-top: 6px; }
      #profCard .stats { display: flex; gap: 40px; margin-top: 14px; font-size: 24px; color: #a99c7f; }
      #profCard .stats b { color: #fff; font-size: 30px; margin-right: 6px; }
      #days { position: absolute; left: 44px; right: 44px; top: 222px; display: flex; justify-content: space-between; }
      .day { width: 104px; height: 92px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(201,165,76,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; color: #a99c7f; }
      .day i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #1a1408; font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-top: 6px; }
      #tiles { position: absolute; left: 44px; right: 44px; top: 340px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .tile { height: 140px; border-radius: 22px; background: linear-gradient(160deg, #2a2418, #15120c); border: 1.5px solid rgba(201,165,76,0.25); padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; }
      .tile svg { width: 100%; height: 56px; }
      .tile span { font-size: 25px; font-weight: 800; line-height: 1.1; color: #f5ead0; }
      .tile.hot { border-color: var(--gold); box-shadow: 0 0 40px rgba(201,165,76,0.55); }

      /* E chips */
      .bigchip { position: absolute; left: 50%; padding: 26px 48px; border-radius: 28px; font-weight: 900; font-size: 64px; letter-spacing: 0.01em; background: rgba(15,13,9,0.88); border: 2px solid var(--line); white-space: nowrap; opacity: 0; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
      .bigchip .strike { position: absolute; left: 30px; right: 30px; top: 50%; height: 12px; margin-top: -6px; background: var(--red); border-radius: 6px; transform-origin: 0 50%; box-shadow: 0 0 20px rgba(229,72,77,0.7); }
      .bigchip .x { position: absolute; right: -30px; top: -30px; width: 70px; height: 70px; border-radius: 50%; background: var(--red); color: #fff; font-size: 44px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

      /* F CTA */
      #ctaTitle { position: absolute; top: 200px; width: 100%; text-align: center; opacity: 0; }
      #ctaTitle .serif { font-size: 64px; color: #f3e3b5; display: block; }
      #ctaTitle b { font-size: 120px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
      #ctaCard { left: 120px; top: 420px; width: 840px; height: 400px; opacity: 0; }
      #ctaCard .row { position: absolute; left: 44px; top: 44px; display: flex; align-items: center; gap: 28px; }
      #ctaCard img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; }
      #ctaCard .handle { font-size: 52px; font-weight: 800; }
      #ctaCard .bio { font-size: 30px; color: #cfc3a6; margin-top: 4px; }
      #followBtn { position: absolute; left: 44px; right: 44px; bottom: 36px; height: 112px; border-radius: 26px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1408; font-weight: 900; font-size: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(201,165,76,0.5); }
      #followBtn .on { position: absolute; inset: 0; border-radius: 26px; background: #1d1910; border: 2px solid var(--gold); color: var(--gold-hi); display: flex; align-items: center; justify-content: center; opacity: 0; }
      .spark { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 16px var(--gold); opacity: 0; }

      /* ---------- captions ---------- */
      #caps { position: absolute; inset: 0; pointer-events: none; }
      .cg { position: absolute; left: 70px; right: 70px; top: 1330px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 22px; opacity: 0; text-align: center; }
      .cg.hook { top: 1290px; }
      .w { position: relative; display: inline-block; font-weight: 800; font-size: 78px; line-height: 1.12; letter-spacing: -0.01em; color: #fff; opacity: 0.38;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 26px rgba(0,0,0,0.75); }
      .hook .w { font-size: 96px; font-weight: 900; }
      .w.s { margin: 0 6px; font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 100px; color: #f6e6b8; letter-spacing: 0; }
      .hook .w.s { font-size: 118px; }
      .w.g { color: var(--gold-hi); }
      .w.b { color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); padding: 0 22px; border-radius: 16px; text-shadow: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(201,165,76,0.45); transform: rotate(-2deg); }
      .w.u .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 12px; border-radius: 6px; background: var(--gold); transform: scaleX(0); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(201,165,76,0.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="34" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="34" data-track-index="0"></div>

      <div id="camwrap">
        <video id="cam" class="clip" data-start="0" data-duration="34" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        <div id="camfade"></div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="34" data-track-index="2"></div>

      <!-- A1: chart + close + timer -->
      <div id="pA1" class="clip" data-start="0.7" data-duration="3.75" data-track-index="3">
        <div id="chartCard" class="card">
          <div class="hdr">
            <div class="btc">₿</div>
            <div class="pair">BTC / USDT</div>
            <div class="price"><b id="priceVal">67.420,15</b><span>−4,82 %</span></div>
          </div>
          <div class="tabs"><div>1m</div><div>15m</div><div>4H</div><div>1D</div><div>RSI</div><div>MACD</div><div>EMA 200</div><div>Fib</div></div>
          <svg id="chartSvg" width="800" height="360" viewBox="0 0 800 390"></svg>
          <div id="closeX">✕</div>
        </div>
        <svg id="cur1" class="cursor" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6L9.4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>

      <!-- name lower third -->
      <div id="pName" class="clip" data-start="13.55" data-duration="2.5" data-track-index="3">
        <div id="nameCard" class="card">
          <img src="assets/logo.jpg" alt="" />
          <div>
            <div class="nm">UNAI</div>
            <div class="sub">En Bitcoin desde <span id="yearBox">2018</span></div>
          </div>
        </div>
      </div>

      <!-- C: community -->
      <div id="pC" class="clip" data-start="16.0" data-duration="6.65" data-track-index="3">
        <div id="netWrap">
          <svg id="netLines" width="1080" height="760"></svg>
          <div id="netLogo"><img src="assets/logo.jpg" alt="" /></div>
        </div>
        <div id="counter"><b class="goldtext" id="countVal">+0</b><span class="serif">personas</span></div>
        <div id="pills">
          <div class="chip" id="pill1">Aprender</div>
          <div class="chip" id="pill2" style="background:var(--gold);color:#1a1408;border-color:var(--gold)">Invertir</div>
        </div>
      </div>

      <!-- F: CTA -->
      <div id="pF" class="clip" data-start="31.2" data-duration="2.8" data-track-index="3">
        <div id="ctaTitle"><span class="serif">si te interesa…</span><b class="goldtext">SÍGUEME</b></div>
        <div id="ctaCard" class="card">
          <div class="row">
            <img src="assets/logo.jpg" alt="" />
            <div>
              <div class="handle">@TheCryptons_</div>
              <div class="bio">Bitcoin explicado como me hubiese gustado</div>
            </div>
          </div>
          <div id="followBtn">Seguir<div class="on">Siguiendo ✓</div></div>
          <div id="sparks"></div>
        </div>
        <svg id="cur2" class="cursor" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6L9.4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="34" data-track-index="4"></div>
      <div id="flash" class="clip" data-start="0" data-duration="34" data-track-index="5"></div>
    </div>

    <script>
      // ---------- deterministic helpers ----------
      const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const NS = "http://www.w3.org/2000/svg";

      // ---------- candle chart ----------
      const chart = $("#chartSvg"); const candles = [];
      let p = 260;
      for (let i = 0; i < 30; i++) {
        const o = p; p = p + (rnd(i) - 0.62) * 46 + (i > 18 ? 10 : 0); p = Math.max(40, Math.min(350, p));
        const c = p; const hi = Math.min(o, c) - 8 - rnd(i + 50) * 26; const lo = Math.max(o, c) + 8 + rnd(i + 90) * 26;
        const up = c < o; const x = 14 + i * 26; const col = up ? "#3fbf7f" : "#e5484d";
        const g = document.createElementNS(NS, "g");
        const wick = document.createElementNS(NS, "line");
        wick.setAttribute("x1", x + 8); wick.setAttribute("x2", x + 8); wick.setAttribute("y1", hi); wick.setAttribute("y2", lo); wick.setAttribute("stroke", col); wick.setAttribute("stroke-width", 2);
        const body = document.createElementNS(NS, "rect");
        body.setAttribute("x", x); body.setAttribute("width", 16); body.setAttribute("y", Math.min(o, c)); body.setAttribute("height", Math.max(4, Math.abs(c - o))); body.setAttribute("rx", 2); body.setAttribute("fill", col);
        g.appendChild(wick); g.appendChild(body); chart.appendChild(g); candles.push(g);
        g.style.transformOrigin = `${x + 8}px ${(hi + lo) / 2}px`;
      }
      const ma = document.createElementNS(NS, "path");
      let d = ""; for (let i = 0; i < 30; i++) { const y = 170 + Math.sin(i / 3.2) * 60 + i * 2.4; d += (i ? "L" : "M") + (22 + i * 26) + " " + y; }
      ma.setAttribute("d", d); ma.setAttribute("fill", "none"); ma.setAttribute("stroke", "#c9a54c"); ma.setAttribute("stroke-width", 3); ma.setAttribute("stroke-dasharray", 1200); ma.setAttribute("stroke-dashoffset", 1200);
      chart.appendChild(ma);
      const ma2 = ma.cloneNode(); let d2 = ""; for (let i = 0; i < 30; i++) { const y = 230 + Math.cos(i / 4) * 50 - i * 1.5; d2 += (i ? "L" : "M") + (22 + i * 26) + " " + y; }
      ma2.setAttribute("d", d2); ma2.setAttribute("stroke", "#7aa2ff"); chart.appendChild(ma2);

      // ---------- community network ----------
      const net = $("#netWrap"), lines = $("#netLines"); const avs = [];
      const cx = 540, cy = 330;
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2 + 0.2; const r = (i % 2 ? 300 : 225) + rnd(i + 7) * 30;
        const x = cx + Math.cos(a) * r * 1.35, y = cy + Math.sin(a) * r * 0.95;
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", cx); l.setAttribute("y1", cy); l.setAttribute("x2", x); l.setAttribute("y2", y); l.style.opacity = 0; lines.appendChild(l);
        const av = document.createElement("div"); av.className = "av"; av.style.left = x - 37 + "px"; av.style.top = y - 37 + "px"; gsap.set(av, { scale: 0 });
        net.appendChild(av); avs.push([av, l]);
      }

      // ---------- CTA sparks ----------
      const sparks = $("#sparks"); const sp = [];
      for (let i = 0; i < 14; i++) { const s = document.createElement("div"); s.className = "spark"; s.style.left = 411 + "px"; s.style.top = 316 + "px"; sparks.appendChild(s); sp.push(s); }

      // ---------- captions ----------
      // [text, start, style]  style: g gold, u underline, s serif, b box
      const G = [
        { e: 0.82, hook: 1, w: [["La", 0], ["primera", 0.44, "g"], ["vez", 0.64]] },
        { e: 1.76, hook: 1, w: [["que", 0.82], ["abrí", 0.98], ["un", 1.16], ["gráfico", 1.42, "u"]] },
        { e: 2.7, hook: 1, w: [["de", 1.76], ["Bitcoin,", 1.86, "g"]] },
        { e: 3.34, w: [["cerré", 2.7, "b"], ["la", 2.78], ["aplicación", 2.92]] },
        { e: 4.34, w: [["a", 3.34], ["los", 3.54], ["dos", 3.76, "u"], ["minutos,", 3.94, "u"]] },
        { e: 5.5, w: [["que", 4.34], ["si", 4.5], ["velas,", 4.66, "g"], ["siglas,", 5.04, "g"]] },
        { e: 6.3, w: [["palabras", 5.5], ["en", 5.92], ["inglés…", 6.14, "s"]] },
        { e: 7.2, w: [["no", 6.3], ["entendía", 6.62]] },
        { e: 8.76, w: [["absolutamente", 7.2], ["NADA", 8.02, "b"]] },
