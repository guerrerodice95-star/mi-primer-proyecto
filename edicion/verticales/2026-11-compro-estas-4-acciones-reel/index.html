      for (let i = 0; i < 4; i++) svl("line", { x1: 0, x2: 960, y1: 20 + i * 80, y2: 20 + i * 80, stroke: "rgba(255,255,255,.06)", "stroke-width": 2 });
      const bmn = Math.min(...BTC), bmx = Math.max(...BTC), BN = BTC.length;
      const GX = (i) => (i / (BN - 1)) * 950, GY = (v) => 250 - ((v - bmn) / (bmx - bmn)) * 230;
      const bar = svl("path", { d: "", fill: "url(#rg)" }), bln = svl("path", { d: "", fill: "none", stroke: "#ff3b4e", "stroke-width": 6, "stroke-linejoin": "round", style: "filter:drop-shadow(0 0 8px rgba(255,59,78,.8))" });
      const bdot = svl("circle", { r: 11, fill: "#fff", opacity: 0 });
      const fmtN = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      tl.set(bt, { opacity: 1 }, 0);
      tl.set(bdot, { opacity: 1 }, 0);
      const bpr = { k: 0.74 };
      const drawB = () => {
        const m = Math.max(1, Math.round(bpr.k * (BN - 1)));
        let d = `M0 ${GY(BTC[0])}`; for (let i = 1; i <= m; i++) d += ` L${GX(i)} ${GY(BTC[i])}`;
        bln.setAttribute("d", d); bar.setAttribute("d", d + ` L${GX(m)} 270 L0 270 Z`);
        bdot.setAttribute("cx", GX(m)); bdot.setAttribute("cy", GY(BTC[m]));
        $("#bpx").textContent = fmtN(BTC[m]) + " pts";
      };
      drawB();
      tl.to(bpr, { k: 1, duration: 1.5, ease: "none", onUpdate: drawB }, 0.0);
      tl.to("#bpx", { color: "#ff6b70", duration: 0.3 }, 0.3);
      tl.fromTo("#bpc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.5);
      tl.to("#redTint", { opacity: 0 }, 0);
      tl.to(bt, { x: -8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 1.75);
      tl.to(bt, { opacity: 0, y: -20, duration: 0.25 }, 2.2);
      tl.to(hook, { opacity: 0, y: -20, duration: 0.2, stagger: 0.03 }, 3.06);

      // ---------- CMC cards (same as the old reel): price 1 = "compro", price 2 = "compro más" ----------
      const CARDS = [
        ["nvda", "NVIDIA", "NVDA", "NASDAQ", "", "$153", "▼ 8.53% (1W)", "$130", "▼ 15.85%", 3.22, 5.28, 6.8],
        ["tsla", "Tesla", "TSLA", "NASDAQ", "", "$370", "▲ 0.57% (1W)", "$320", "▼ 16.22%", 6.94, 9.06, 10.56],
        ["spcx", "SpaceX", "SPCX", "NASDAQ", "", "$130", "▼ 1.69% (1W)", "$100", "▼ 28.91%", 10.7, 13.18, 14.6],
        ["gold", "Oro", "XAU", "COMEX", "", "$3,850", "▼ 4.11% (1W)", "$3,350", "▼ 13.32%", 14.7, 16.94, 18.3],
      ];
      const W = (txt, size) => { const c = document.createElement("canvas").getContext("2d"); c.font = `900 ${size}px Inter`; return c.measureText(txt).width; };
      CARDS.forEach(([id, name, sym, rank, watch, p1, c1, p2, c2, tin, t2, tout]) => {
        const card = mk(`<div class="hd"><img src="assets/logos/${id}.png"><b>${name}</b><span>${sym}</span><i>${rank}</i></div>
          <div class="btn st">☆</div><div class="btn sh"><svg viewBox="0 0 24 24" width="38" height="38"><circle cx="18" cy="5" r="2.6" fill="none" stroke="#a1a7bb" stroke-width="2"/><circle cx="6" cy="12" r="2.6" fill="none" stroke="#a1a7bb" stroke-width="2"/><circle cx="18" cy="19" r="2.6" fill="none" stroke="#a1a7bb" stroke-width="2"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4" stroke="#a1a7bb" stroke-width="2"/></svg></div>
          <div class="px">${p1}</div><div class="ch ${c1[0] === "▲" ? "up" : "dn"}">${c1}</div>`, "cmc", "");
        const px = card.querySelector(".px"), ch = card.querySelector(".ch");
        const place = (p) => { ch.style.left = (44 + W(p, 104) * 0.98 + 26) + "px"; };
        place(p1);
        tl.set(card, { opacity: 1 }, tin);
        const cls = (t) => "ch " + (t[0] === "▲" ? "up" : "dn");
        tl.call(() => { px.textContent = p1; ch.textContent = c1; ch.className = cls(c1); place(p1); }, null, tin);
        tl.call(() => { px.textContent = p2; ch.textContent = c2; ch.className = cls(c2); place(p2); }, null, t2);
        tl.call(() => { px.textContent = p1; ch.textContent = c1; ch.className = cls(c1); place(p1); }, null, t2 - 0.01);
        tl.set(card, { opacity: 0 }, tout);
      });

      // ---------- CTA ----------
      const NAME = "@TheCryptons_";
      NAME.split("").forEach((ch) => { const sp = document.createElement("span"); sp.textContent = ch; $("#igName").appendChild(sp); });
      tl.set("#caps", { y: -40 }, 19.04);
      tl.fromTo("#ig", { opacity: 0, y: 80, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 18.84);
      $$("#igName span").forEach((sp, i) => tl.fromTo(sp, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(3)" }, 18.96 + i * 0.016));
      const BX = 750, BY = 1675, SX = 920;
      tl.fromTo("#tap", { opacity: 0, x: BX + 120, y: BY + 220 }, { opacity: 1, x: BX - 6, y: BY - 4, duration: 0.32, ease: "power2.inOut" }, 19.19);
      tl.to("#tap", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, 19.56);
      tl.to("#igBtn", { scale: 0.92, duration: 0.07, yoyo: true, repeat: 1 }, 19.56);
      tl.fromTo("#ripple", { opacity: 1, x: BX - 30, y: BY - 30, scale: 0.4 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: "power2.out" }, 19.58);
      tl.to("#igBtn .on", { opacity: 1, duration: 0.1 }, 19.62);
      tl.to("#tap", { x: SX - 6, duration: 0.28, ease: "power2.inOut" }, 19.86);
      tl.to("#tap", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, 20.16);
      tl.to("#igSave", { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 20.16);
      tl.fromTo("#ripple", { opacity: 1, x: SX - 30, y: BY - 30, scale: 0.4 }, { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.out", immediateRender: false }, 20.18);
      tl.to("#bmk", { attr: { fill: "#111" }, duration: 0.1 }, 20.20);
      tl.to("#tap", { opacity: 0, duration: 0.3 }, 20.54);
      // ---------- captions timeline ----------
      groups.forEach((g) => {
        tl.fromTo(g.el, { opacity: 0, y: 22, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: Math.max(0.04, Math.min(0.18, g.e - g.s - 0.02)), ease: "power2.out" }, g.s);
        tl.set(g.el, { opacity: 0 }, g.e);
        g.ws.forEach((w) => {
          tl.to(w.el, { opacity: 1, duration: 0.06 }, w.s);
          if (["b", "s", "g", "up", "dn"].includes(w.st)) tl.fromTo(w.el, { scale: 0.7 }, { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, w.s);
          if (w.st === "u") tl.to(w.el.querySelector(".ul"), { scaleX: 1, duration: 0.25, ease: "power2.out" }, w.s);
        });
      });

      tl.set({}, {}, 21.0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
