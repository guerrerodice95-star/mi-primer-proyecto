        tl.set(d, { opacity: 0, x: GQ[i][0] - 30, y: GQ[i][1] - c.top, scale: GS, transformOrigin: "0 0" }, 22.05);
        tl.to(d, { opacity: 1, duration: 0.3 }, 22.26 + i * 0.12);
      });
      const above = pill(svg, 510, 700, "TERMINA MÁS ARRIBA DE DONDE CAYÓ", GOLD, "#1a1408", "middle", 30);
      show(above, 26.4);

      // ---------- "los que vendieron en lo peor del COVID…" ----------
      cardEls.slice(1).forEach((d) => tl.to(d, { opacity: 0, duration: 0.25 }, 29.3));
      hide(above, 29.3, 0.25);
      const c0 = CARDS[0], k0 = CW / c0.w;
      tl.to(cardEls[0], { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power2.inOut" }, 29.45);
      const LX = 30 + 227 * k0, LY = c0.top + 413 * k0;                      // the COVID low on the card
      const dim = document.createElement("div");
      dim.style.cssText = `position:absolute;top:0;bottom:0;left:${229 * k0}px;right:0;background:rgba(8,8,10,0.62);border-radius:0 16px 16px 0;opacity:0;`;
      cardEls[0].appendChild(dim);
      const soldR = ring(svg, LX, LY - 6, 30, 30, RED);
      const soldP = pill(svg, LX + 14, LY + 62, "VENDISTE AQUÍ", RED, "#fff", "start", 28);
      drawRing(soldR, 30.4, 0.45);
      show(soldP, 30.6);
      tl.to(dim, { opacity: 1, duration: 0.5 }, 32.0);
      const missed = pill(svg, 640, c0.top + 150, "TE PERDISTE LA RECUPERACIÓN", "#1d1910", "#ff8d90", "middle", 28);
      show(missed, 32.1);
      const fortune = pill(svg, 640, c0.top + 220, "Y UNA GRAN FORTUNA", RED, "#fff", "middle", 30);
      show(fortune, 33.7);

      // ---------- CTA ----------
      const NAME = "@TheCryptons_";
      NAME.split("").forEach((ch) => { const sp = document.createElement("span"); sp.textContent = ch; $("#igName").appendChild(sp); });
      tl.set("#caps", { y: -40 }, 47.30);
      tl.fromTo("#ig", { opacity: 0, y: 80, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 47.10);
      $$("#igName span").forEach((sp, i) => tl.fromTo(sp, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(3)" }, 47.22 + i * 0.018));
      const BX = 750, BY = 1675, SX = 920;
      tl.fromTo("#tap", { opacity: 0, x: BX + 120, y: BY + 220 }, { opacity: 1, x: BX - 6, y: BY - 4, duration: 0.32, ease: "power2.inOut" }, 47.45);
      tl.to("#tap", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, 47.82);
      tl.to("#igBtn", { scale: 0.92, duration: 0.07, yoyo: true, repeat: 1 }, 47.82);
      tl.fromTo("#ripple", { opacity: 1, x: BX - 30, y: BY - 30, scale: 0.4 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: "power2.out" }, 47.84);
      tl.to("#igBtn .on", { opacity: 1, duration: 0.1 }, 47.88);
      tl.to("#tap", { x: SX - 6, duration: 0.28, ease: "power2.inOut" }, 48.12);
      tl.to("#tap", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, 48.42);
      tl.to("#igSave", { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 48.42);
      tl.fromTo("#ripple", { opacity: 1, x: SX - 30, y: BY - 30, scale: 0.4 }, { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.out", immediateRender: false }, 48.44);
      tl.to("#bmk", { attr: { fill: "#111" }, duration: 0.1 }, 48.46);
      tl.to("#tap", { opacity: 0, duration: 0.3 }, 48.80);

      // ---------- captions timeline ----------
      groups.forEach((g) => {
        tl.fromTo(g.el, { opacity: 0, y: 22, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "power2.out" }, g.s);
        tl.set(g.el, { opacity: 0 }, g.e);
        g.ws.forEach((w) => {
          tl.to(w.el, { opacity: 1, duration: 0.06 }, w.s);
          if (["b", "s", "g", "up", "dn"].includes(w.st)) tl.fromTo(w.el, { scale: 0.7 }, { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, w.s);
          if (w.st === "u") tl.to(w.el.querySelector(".ul"), { scaleX: 1, duration: 0.25, ease: "power2.out" }, w.s);
        });
      });

      tl.set({}, {}, 49.16);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
