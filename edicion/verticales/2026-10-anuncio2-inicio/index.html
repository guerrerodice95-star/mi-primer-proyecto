<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a08; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }

      /* origin near the face: zooms push the head up (less ceiling) */
      #camwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 700px; }
      #cam { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: contrast(1.1) saturate(1.06) brightness(0.95) sepia(0.07); }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(130% 85% at 50% 38%, transparent 55%, rgba(0,0,0,0.5) 100%), linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.45) 100%); }

      #caps { position: absolute; inset: 0; pointer-events: none; }
      .cg { position: absolute; left: 60px; right: 60px; top: 1270px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 22px; opacity: 0; text-align: center; }
      .cg.hook { top: 1250px; gap: 0 30px; }
      .w { position: relative; display: inline-block; font-weight: 800; font-size: 78px; line-height: 1.14; letter-spacing: -0.01em; color: #fff; opacity: 0.38;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 26px rgba(0,0,0,0.75); }
      .hook .w { font-size: 94px; font-weight: 900; }
      .w.s { margin: 0 6px; font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 100px; color: #f6e6b8; letter-spacing: 0; }
      .w.g { color: var(--gold-hi); }
      .w.b { color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); padding: 0 24px; border-radius: 16px; text-shadow: none; font-weight: 900;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(201,165,76,0.45); }
      .w.u .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 12px; border-radius: 6px; background: var(--gold); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(201,165,76,0.8); }
      #wheel { width: 104px; height: 104px; opacity: 0; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6)) drop-shadow(0 0 16px rgba(201,165,76,0.5)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.82" data-width="1080" data-height="1920">
      <div id="camwrap">
        <video id="cam" class="clip" data-start="0" data-duration="12.82" data-track-index="0" src="assets/cam.mp4" muted playsinline></video>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="12.82" data-track-index="1"></div>
      <div id="caps" class="clip" data-start="0" data-duration="12.82" data-track-index="2"></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";

      // ---------- captions ----------
      const G = [
        { e: 0.78, hook: 1, w: [["Cuando", 0], ["empecé", 0.32]] },
        { e: 1.1, hook: 1, w: [["en", 0.64], ["Bitcoin", 0.78, "g"]] },
        { e: 2.74, w: [["seguía", 1.1], ["lo", 1.84], ["que", 2.12], ["escuchaba", 2.34]] },
        { e: 3.08, w: [["en", 2.74], ["YouTube", 2.86, "u"]] },
        { e: 4.3, w: [["y", 3.08], ["luego", 3.4], ["rezaba", 3.72, "s"]] },
        { e: 5.64, w: [["porque", 4.3], ["saliera", 4.74], ["bien.", 5.2, "s"]] },
        { e: 6.5, w: [["Con", 5.64], ["el", 5.7], ["tiempo", 5.86], ["entendí", 6.04, "u"]] },
        { e: 7.1, w: [["que", 6.5], ["yo", 6.72], ["solo", 6.96, "s"]] },
        { e: 7.9, w: [["en", 7.1], ["mi", 7.2], ["habitación", 7.36, "g"]] },
        { e: 9.2, w: [["estaba", 7.9], ["más", 8.36], ["cerca", 8.86]] },
        { e: 9.96, w: [["de", 9.2], ["jugar", 9.48], ["a", 9.66], ["la", 9.82]] },
        { e: 10.56, w: [["RULETA", 9.96, "b"], ["que", 10.36]], wheel: 1 },
        { e: 11.24, w: [["de", 10.56], ["entender", 10.82, "u"]] },
        { e: 11.94, w: [["por", 11.24, "s"], ["fin", 11.6, "s"]] },
        { e: 12.82, w: [["lo", 11.94], ["que", 12.4], ["hacía.", 12.6, "g"]] },
      ];
      const caps = $("#caps");
      const groups = G.map((g) => {
        const el = document.createElement("div"); el.className = "cg" + (g.hook ? " hook" : "");
        const ws = g.w.map(([t, s, st]) => {
          const sp = document.createElement("span"); sp.className = "w" + (st ? " " + st : ""); sp.textContent = t;
          if (st === "u") { const u = document.createElement("span"); u.className = "ul"; sp.appendChild(u); }
          el.appendChild(sp); return { el: sp, s, st };
        });
        if (g.wheel) {
          const svg = document.createElementNS(NS, "svg"); svg.id = "wheel"; svg.setAttribute("viewBox", "-52 -52 104 104");
          const segs = 12;
          for (let i = 0; i < segs; i++) {
            const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", `M0 0 L${50 * Math.cos(a0)} ${50 * Math.sin(a0)} A50 50 0 0 1 ${50 * Math.cos(a1)} ${50 * Math.sin(a1)} Z`);
            p.setAttribute("fill", i % 2 ? "#14110b" : (i % 4 === 0 ? "#c9a54c" : "#9b2c2c"));
            svg.appendChild(p);
          }
          const rim = document.createElementNS(NS, "circle"); rim.setAttribute("r", 50); rim.setAttribute("fill", "none"); rim.setAttribute("stroke", "#f0d488"); rim.setAttribute("stroke-width", 4); svg.appendChild(rim);
          const hub = document.createElementNS(NS, "circle"); hub.setAttribute("r", 12); hub.setAttribute("fill", "#f0d488"); svg.appendChild(hub);
          el.insertBefore(svg, ws[1].el);
        }
        caps.appendChild(el); return { el, s: g.w[0][1], e: g.e, ws };
      });
      gsap.set(".w.u .ul", { scaleX: 0 });

      // ---------- camera: tight framing, jump cuts on strong phrases ----------
      // the source already has its own cuts at 1.08, 3.16 (second, closer angle) and 5.4
      const Y = -40;
      tl.fromTo(cam, { scale: 1.32, y: -260 }, { scale: 1.25, duration: 1.08, ease: "power2.out" }, 0);
      tl.set(cam, { scale: 1.15, y: Y }, 1.08);
      tl.to(cam, { scale: 1.19, duration: 2.08, ease: "none" }, 1.08);
      tl.set(cam, { scale: 1.0, y: 0 }, 3.16);
      tl.to(cam, { scale: 1.04, duration: 2.24, ease: "none" }, 3.16);
      tl.set(cam, { scale: 1.15, y: Y }, 5.4);
      tl.to(cam, { scale: 1.18, duration: 2.5, ease: "none" }, 5.4);
      tl.set(cam, { scale: 1.3 }, 7.9);
      tl.to(cam, { scale: 1.33, duration: 2.06, ease: "none" }, 7.9);
      tl.set(cam, { scale: 1.15 }, 9.96);
      tl.to(cam, { scale: 1.17, duration: 0.86, ease: "none" }, 9.96);
      tl.set(cam, { scale: 1.28 }, 10.82);
      tl.to(cam, { scale: 1.31, duration: 2.0, ease: "none" }, 10.82);

      // ---------- captions timeline ----------
      groups.forEach((g) => {
        tl.fromTo(g.el, { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2)" }, g.s);
        tl.set(g.el, { opacity: 0 }, g.e);
        g.ws.forEach((w) => {
          tl.to(w.el, { opacity: 1, duration: 0.06 }, w.s);
          if (w.st === "b" || w.st === "s" || w.st === "g") tl.fromTo(w.el, { scale: 0.6 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, w.s);
          if (w.st === "u") tl.to(w.el.querySelector(".ul"), { scaleX: 1, duration: 0.25, ease: "power2.out" }, w.s);
        });
      });
      tl.fromTo("#wheel", { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 9.96);
      tl.fromTo("#wheel", { rotation: 0 }, { rotation: 900, duration: 0.6, ease: "power2.out" }, 9.96);

      tl.set({}, {}, 12.82);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
