<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

      :root { --gold: #c9a54c; --gold-hi: #f0d488; --gold-lo: #8a6d2a; --cream: #f3e3b5; --green: #3fbf7f; --red: #e5484d; --line: rgba(201,165,76,0.38); --bg: #0b0a08; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; }

      #bg { background: radial-gradient(900px 600px at 50% 72%, rgba(201,165,76,0.14), transparent 70%), var(--bg); }
      #grid { background-image: linear-gradient(rgba(201,165,76,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,165,76,0.06) 1px, transparent 1px); background-size: 60px 60px;
        -webkit-mask-image: linear-gradient(180deg, transparent 6%, #000 12%, #000 42%, transparent 52%); mask-image: linear-gradient(180deg, transparent 6%, #000 12%, #000 42%, transparent 52%); }

      /* source (cropped band 1728x1448) */
      #camwrap { position: absolute; left: 0; top: 0; width: 1728px; height: 1448px; transform-origin: 864px 0px; }
      #track { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; width: 1728px; height: 1448px; object-fit: cover; filter: contrast(1.08) saturate(1.05) brightness(1.06); }
      #topfade { position: absolute; left: 0; top: 0; width: 1080px; height: 220px; pointer-events: none; background: linear-gradient(180deg, rgba(11,10,8,0.9) 0%, rgba(11,10,8,0.4) 50%, rgba(11,10,8,0) 100%); }
      /* below the face strip everything is clean background for the chart */
      #strip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none;
        background: linear-gradient(180deg, var(--bg) 0px, var(--bg) 960px, rgba(11,10,8,0) 1060px, rgba(11,10,8,0) 1920px); }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 85% at 50% 30%, transparent 60%, rgba(0,0,0,0.4) 100%); }

      /* chart card */
      #card { position: absolute; left: 30px; top: 175px; width: 1020px; height: 690px; opacity: 0; }
      #card svg { position: absolute; inset: 0; }
      text { font-family: "Inter", sans-serif; }
      .yr { font-size: 30px; font-weight: 900; letter-spacing: 0.08em; fill: var(--gold-hi); }
      .px { font-size: 30px; font-weight: 900; }
      .sm { font-size: 24px; font-weight: 800; letter-spacing: 0.06em; }

      /* captions */
      #caps { position: absolute; inset: 0; pointer-events: none; }
      .cg { position: absolute; left: 60px; right: 60px; top: 1480px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 20px; opacity: 0; text-align: center; }
      .cg.hook { gap: 0 26px; }
      .w { position: relative; display: inline-block; font-weight: 900; font-size: 96px; text-transform: uppercase; line-height: 1.14; letter-spacing: -0.01em; color: #fff; opacity: 0.38;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 26px rgba(0,0,0,0.75); }
      .hook .w { font-size: 104px; font-weight: 900; }
      .w.s { margin: 0 6px; font-family: "Serif", serif; font-style: italic; font-weight: 400; font-size: 112px; text-transform: none; color: #f6e6b8; letter-spacing: 0; }
      .w.g { color: var(--gold-hi); }
      .w.up { color: #6fe0a6; }
      .w.dn { color: #ff7a7e; }
      .w.b, .w.bup, .w.bdn { padding: 0 20px; border-radius: 16px; text-shadow: none; font-weight: 900; }
      .w.b { color: #1a1408; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(201,165,76,0.45); }
      .w.bup { color: #fff; background: var(--green); }
      .w.bdn { color: #fff; background: var(--red); }
      .w.u .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 11px; border-radius: 6px; background: var(--gold); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(201,165,76,0.8); }

      /* Instagram follow pill */
      #ig { position: absolute; left: 90px; right: 90px; top: 1600px; height: 150px; border-radius: 34px; background: #ffffff; opacity: 0;
        display: flex; align-items: center; padding: 0 26px; gap: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
      #ig img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 4px #fff, 0 0 0 7px #d62976; }
      #igName { flex: 1; font-weight: 800; font-size: 40px; color: #111; letter-spacing: -0.01em; white-space: nowrap; }
      #igName span { display: inline-block; }
      #igBtn { position: relative; flex: none; width: 220px; height: 88px; border-radius: 18px; background: #0095f6; color: #fff; font-weight: 800; font-size: 38px; display: flex; align-items: center; justify-content: center; }
      #igBtn .on { position: absolute; inset: 0; border-radius: 18px; background: #efefef; color: #111; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #igSave { position: relative; flex: none; width: 88px; height: 88px; border-radius: 18px; background: #efefef; display: flex; align-items: center; justify-content: center; margin-left: -8px; }
      #igSave svg { width: 46px; height: 46px; }
      #tap { position: absolute; width: 70px; height: 70px; left: 0; top: 0; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }
      #ripple { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.9); left: 0; top: 0; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="53.76" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="53.76" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="53.76" data-track-index="0"></div>
      <div id="camwrap">
        <div id="track">
          <video id="cam" class="clip" data-start="0" data-duration="53.76" data-track-index="1" src="assets/cam.mp4" muted playsinline></video>
        </div>
      </div>
      <div id="strip" class="clip" data-start="0" data-duration="53.76" data-track-index="2"></div>
      <div id="topfade" class="clip" data-start="0" data-duration="53.76" data-track-index="2"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="53.76" data-track-index="2"></div>

      <div id="pCard" class="clip" data-start="0" data-duration="48.9" data-track-index="3">
        <div id="card"><svg id="chart" viewBox="0 0 1020 690" width="1020" height="690"></svg></div>
      </div>

      <div id="pCta" class="clip" data-start="48.6" data-duration="5.16" data-track-index="3">
        <div id="ig">
          <img src="assets/perfil.png" alt="" />
          <div id="igName"></div>
          <div id="igBtn">Seguir<div class="on">Siguiendo</div></div>
          <div id="igSave"><svg viewBox="0 0 24 24"><path id="bmk" d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg></div>
        </div>
        <div id="ripple"></div>
        <svg id="tap" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6L9.4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="53.76" data-track-index="4"></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const cam = "#camwrap";
      const svg = $("#chart");
      const GREEN = "#3fbf7f", RED = "#e5484d", GOLD = "#f0d488", CREAM = "#f3e3b5";

      function el(tag, attrs, parent, text) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text !== undefined) e.textContent = text;
        (parent || svg).appendChild(e); return e;
      }
      const group = (id) => el("g", { id, opacity: 0 });

      // Candles copied from the reference chart, candle by candle (pixel y of open, close, high, low; blue -> green, white -> red).
      const PX23 = [[362,322,300,375],[322,312,293,335],[312,482,310,508],[483,486,455,500],[486,480,465,510],[480,455,445,495],[453,456,445,465],
        [455,468,408,475],[463,467,458,480],[464,472,460,482],[472,456,455,475],[456,315,305,457],[315,245,225,325],[243,205,195,250],[205,235,188,245],
        [236,278,225,288],[278,185,155,292],[184,212,155,240],[212,253,200,260],[255,265,250,358]];
      const PX26 = [[220,265,205,280],[265,405,262,462],[405,373,370,440],[373,405,360,420],[405,455,380,460],[455,402,398,480],[399,402,385,430],
        [399,387,375,415],[386,377,355,395],[377,402,372,418],[402,384,380,420],[384,412,380,418],[412,209,185,414],[207,210,160,220],[209,173,148,222],
        [173,220,165,222],[220,163,155,235],[163,118,80,170],[117,90,68,145],[90,128,80,165],[128,157,120,182],[156,158,154,160]];
      // normalise so 0 = cycle low and 1 = cycle high (2023: 15.6K..25.1K, 2026: 57.7K..87.4K)
      const norm = (px, lo, hi) => px.map((c) => c.map((y) => (lo - y) / (lo - hi)));
      const D23 = norm(PX23, 510, 155).concat([[0.42, 0.55, 0.58, 0.40], [0.55, 0.51, 0.60, 0.47], [0.51, 0.74, 0.77, 0.50], [0.74, 0.70, 0.80, 0.66], [0.70, 0.92, 0.95, 0.68], [0.92, 1.08, 1.12, 0.90]]);
      const D26 = norm(PX26, 480, 68);
      const IB23 = 4, IT23 = 16, ITOUCH23 = 19, IB26 = 5, IT26 = 18;
      const BASE = D23; // used by the hook

      // draws candles; returns per-candle groups (hidden) + mapping helpers
      function chart(parentId, x0, step, w, yBase, yScale, data) {
        const P = $(parentId) || group(parentId.slice(1));
        const Y = (n) => yBase - n * yScale, X = (i) => x0 + i * step;
        const cs = data.map((c, i) => {
          const [o, cl, h, l] = c, col = cl >= o ? GREEN : RED;
          const g = el("g", { opacity: 0 }, P);
          el("line", { x1: X(i), x2: X(i), y1: Y(h), y2: Y(l), stroke: col, "stroke-width": Math.max(2, w / 7), "stroke-linecap": "round" }, g);
          el("rect", { x: X(i) - w / 2, y: Y(Math.max(o, cl)), width: w, height: Math.max(3, Math.abs(cl - o) * yScale), rx: 3, fill: col }, g);
          return g;
        });
        return { P, cs, X, Y };
      }
      const reveal = (cs, from, to, t0, t1) => { for (let i = from; i <= to; i++) tl.to(cs[i], { opacity: 1, duration: 0.12 }, t0 + (t1 - t0) * ((i - from) / Math.max(1, to - from))); };
      const show = (target, t, d = 0.35) => tl.to(target, { opacity: 1, duration: d }, t);
      const draw = (path, t, d = 0.6) => tl.fromTo(path, { attr: { "stroke-dashoffset": path.getTotalLength ? 1000 : 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: "power2.out" }, t);
      function ring(P, cx, cy, rx, ry, col) { return el("ellipse", { cx, cy, rx, ry, fill: "none", stroke: col || GOLD, "stroke-width": 5, "stroke-dasharray": 1000, "stroke-dashoffset": 1000 }, P); }
      function arrow(P, x1, y1, x2, y2, col) {
        const g = el("g", { opacity: 0 }, P);
        el("line", { x1, y1, x2, y2, stroke: col, "stroke-width": 7, "stroke-linecap": "round" }, g);
        const a = Math.atan2(y2 - y1, x2 - x1), L = 22;
        el("path", { d: `M${x2 - L * Math.cos(a - 0.5)} ${y2 - L * Math.sin(a - 0.5)} L${x2} ${y2} L${x2 - L * Math.cos(a + 0.5)} ${y2 - L * Math.sin(a + 0.5)}`, fill: "none", stroke: col, "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
        return g;
      }
      function pill(P, x, y, txt, bg, fg, anchor) {
        const g = el("g", { opacity: 0 }, P);
        const wdt = txt.length * 19 + 36;
        const xx = anchor === "end" ? x - wdt : anchor === "middle" ? x - wdt / 2 : x;
        el("rect", { x: xx, y: y - 30, width: wdt, height: 46, rx: 23, fill: bg }, g);
        el("text", { x: xx + wdt / 2, y: y + 2, "text-anchor": "middle", class: "px", fill: fg, "font-size": 28 }, g, txt);
        return g;
      }

      // ================= HOOK (version B): 2023 traced over 2026 =================
      const H = group("hook");
      const m26 = chart("#hook", 70, 36, 22, 560, 400, D26);
      const ghost23 = el("polyline", { points: D23.map((c, i) => `${m26.X(i - IB23 + IB26)},${m26.Y(c[1])}`).filter((p, i) => i - IB23 + IB26 >= 0 && i - IB23 + IB26 <= 25).join(" "), fill: "none", stroke: GOLD, "stroke-width": 5, "stroke-dasharray": "6 9", opacity: 0 }, H);
      const tag23 = pill(H, 40, 60, "2023", "#1d1910", GOLD);
      const tag26 = pill(H, 175, 60, "2026", "#1d1910", "#7ff0b5");
      const sameH = pill(H, 1000, 60, "MISMO PATRÓN", GOLD, "#1a1408", "end");
      const projH = el("path", { d: `M${m26.X(21)} ${m26.Y(0.78)} L${m26.X(23)} ${m26.Y(0.5)} L${m26.X(25.5)} ${m26.Y(1.3)}`, fill: "none", stroke: GOLD, "stroke-width": 5, "stroke-dasharray": "14 10", opacity: 0 }, H);
      const midH = el("line", { x1: 120, x2: 1000, y1: m26.Y(0.5), y2: m26.Y(0.5), stroke: GOLD, "stroke-width": 3, "stroke-dasharray": "10 8", opacity: 0 }, H);
      const qH = el("text", { x: m26.X(23), y: m26.Y(0.5) + 72, "text-anchor": "middle", "font-size": 64, "font-weight": 900, fill: GOLD, opacity: 0 }, H, "?");
      const dotH = el("circle", { cx: m26.X(23), cy: m26.Y(0.5), r: 12, fill: GOLD, opacity: 0 }, H);
      const m23 = { cs: [] };

      // ================= 2023 =================
      const C1 = group("y23");
      el("text", { x: 40, y: 56, class: "yr" }, C1, "2023");
      const c23 = chart("#y23", 70, 38, 22, 560, 400, D23);
      const low23 = pill(C1, c23.X(IB23) + 34, c23.Y(D23[IB23][3]) + 44, "$15.600", "#1d1910", "#ff8d90");
      const ringLow23 = ring(C1, c23.X(IB23 - 0.5), c23.Y(0.02), 62, 36, RED);
      const top23 = pill(C1, c23.X(IT23), c23.Y(1.0) - 26, "$25.100", "#1d1910", "#7ff0b5", "middle");
      const br23 = el("g", { opacity: 0 }, C1);
      el("path", { d: `M${c23.X(IB23)} ${c23.Y(-0.12) + 20} v12 H${c23.X(IT23)} v-12`, fill: "none", stroke: CREAM, "stroke-width": 3 }, br23);
      el("text", { x: (c23.X(IB23) + c23.X(IT23)) / 2, y: c23.Y(-0.12) + 66, "text-anchor": "middle", class: "sm", fill: CREAM }, br23, "12 SEMANAS");
      const dropA = arrow(C1, c23.X(18) + 40, c23.Y(0.98), c23.X(19) + 46, c23.Y(0.58), RED);
      const dropP = pill(C1, c23.X(19) + 64, c23.Y(0.80), "−22%", RED, "#fff");
      const mid23 = el("line", { x1: c23.X(IB23), x2: 1000, y1: c23.Y(0.5), y2: c23.Y(0.5), stroke: GOLD, "stroke-width": 4, "stroke-dasharray": "14 10", opacity: 0 }, C1);
      const midL23 = pill(C1, 1000, c23.Y(0.5) + 50, "50%", GOLD, "#1a1408", "end");
      const ringTouch23 = ring(C1, c23.X(ITOUCH23), c23.Y(0.5), 34, 40, GOLD);
      const up23 = arrow(C1, c23.X(20) - 4, c23.Y(0.62), c23.X(23) + 10, c23.Y(1.22), GREEN);

      // ================= 2026 =================
      const C2 = group("y26");
      el("text", { x: 40, y: 56, class: "yr" }, C2, "2026");
      const N26 = D26.length;
      const c26 = chart("#y26", 70, 36, 22, 560, 400, D26);
      // 2023 silhouette aligned on the cycle low
      const ghost = el("polyline", { points: D23.map((c, i) => `${c26.X(i - IB23 + IB26)},${c26.Y(c[1])}`).filter((p, i) => i - IB23 + IB26 >= 0 && i - IB23 + IB26 <= 25).join(" "), fill: "none", stroke: "rgba(240,212,136,0.6)", "stroke-width": 4, "stroke-dasharray": "4 8", opacity: 0 }, C2);
      const ghostL = pill(C2, c26.X(23), c26.Y(1.22), "= 2023", "#1d1910", GOLD, "middle");
      const low26 = pill(C2, c26.X(IB26) + 34, c26.Y(D26[IB26][3]) + 44, "$57.700", "#1d1910", "#ff8d90");
      const ringLow26 = ring(C2, c26.X(IB26 - 0.5), c26.Y(0.02), 62, 36, RED);
      const top26 = pill(C2, c26.X(IT26), c26.Y(1.0) - 26, "$87.400", "#1d1910", "#7ff0b5", "middle");
      const br26 = el("g", { opacity: 0 }, C2);
      el("path", { d: `M${c26.X(IB26)} ${c26.Y(-0.12) + 20} v12 H${c26.X(IT26)} v-12`, fill: "none", stroke: CREAM, "stroke-width": 3 }, br26);
      el("text", { x: (c26.X(IB26) + c26.X(IT26)) / 2, y: c26.Y(-0.12) + 66, "text-anchor": "middle", class: "sm", fill: CREAM }, br26, "12 SEMANAS");
      const mid26 = el("line", { x1: c26.X(IB26), x2: 1000, y1: c26.Y(0.5), y2: c26.Y(0.5), stroke: GOLD, "stroke-width": 4, "stroke-dasharray": "14 10", opacity: 0 }, C2);
      const midL26 = pill(C2, c26.X(6), c26.Y(0.5) - 24, "50% · $72.500", GOLD, "#1a1408");
      const proj = el("path", { d: `M${c26.X(21)} ${c26.Y(0.78)} L${c26.X(23)} ${c26.Y(0.5)} L${c26.X(25.5)} ${c26.Y(1.3)}`, fill: "none", stroke: GOLD, "stroke-width": 5, "stroke-dasharray": "14 10", opacity: 0 }, C2);
      const dot26 = el("circle", { cx: c26.X(23), cy: c26.Y(0.5), r: 14, fill: GOLD, opacity: 0 }, C2);
      const ringDot26 = ring(C2, c26.X(23), c26.Y(0.5), 44, 34, GOLD);
      const up26 = arrow(C2, c26.X(23.3), c26.Y(0.6), c26.X(25.5), c26.Y(1.25), GREEN);
